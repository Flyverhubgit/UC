<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- opened from the home screen it runs like an app, without the browser's bars -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Enhjørningen">
<!-- installable as an app on Android (and other devices): icon, full screen, works without internet -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfe6ff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Enhjørningen min</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. A 3D meadow with the unicorn and cat, care tools, colour box.
     Phone: stacked. Wide screen: stage left, controls right. Single theme on purpose. */
  color-scheme: light;
  --sky-1:#bfe0ff;
  --sky-2:#ead9ff;
  --sky-3:#ffe1ec;
  --ink:#4a2f6b;
  --panel:rgba(255,255,255,.86);
  --accent:#ff5fa8;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS","Segoe UI",sans-serif;
  --font-body:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%) fixed;
  background-color:var(--sky-2);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:500;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.game{
  height:100%;min-height:640px;
  display:flex;flex-direction:column;gap:10px;
  padding:12px 16px 16px;
  max-width:1100px;margin:0 auto;
}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(22px,4.5vw,34px);line-height:1;margin:0;
  letter-spacing:.01em;
  text-shadow:0 2px 0 #fff;
}
.stars{
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border-radius:999px;padding:6px 14px 6px 8px;
  font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;
}
.stars svg{width:26px;height:26px}
.stable{display:flex;align-items:center;gap:8px;margin-left:auto}
.chip{
  width:46px;height:46px;border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 2px 0 rgba(74,47,107,.25);
  position:relative;
}
.chip[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.chip.add{
  background:var(--panel);border-style:dashed;border-color:var(--ink);border-width:3px;
  font-size:28px;font-weight:700;line-height:1;
}

/* stage: the 3D picture fills it, sky decorations sit behind, buttons and bubble in front */
.stage{
  position:relative;flex:1 1 auto;min-height:250px;
  border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);
  touch-action:none;
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab}
.cloud{position:absolute;height:26px;border-radius:999px;background:#fff;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44%;height:190%;left:14%;top:-95%}
.cloud::after{width:34%;height:140%;right:16%;top:-60%}
.cloud.c1{width:120px;height:30px;left:7%;top:25%;z-index:3;cursor:pointer;animation:bobcloud 3.2s ease-in-out infinite}
@keyframes bobcloud{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.in-bane .cloud.c1{pointer-events:none;animation:none}
.cloud.c2{width:80px;left:4%;top:41%;opacity:.75}
.rainbow{
  position:absolute;left:50%;bottom:30%;width:min(96%,720px);transform:translateX(-50%);
  opacity:0;transition:opacity 1.2s ease;
}
.happy .rainbow{opacity:.85}
.riding .cloud{animation:drift 7s linear infinite}
.riding .cloud.c2{animation-delay:-3.5s}
@keyframes drift{from{transform:translateX(100vw)}to{transform:translateX(-60vw)}}
.no3d{
  position:absolute;inset:0;z-index:2;display:none;place-items:center;text-align:center;
  padding:24px;font-family:var(--font-display);font-weight:600;font-size:20px;
}
.no3d.show{display:grid}

.stage-actions{
  position:absolute;left:4%;bottom:5%;z-index:3;
  display:flex;gap:10px;align-items:center;
}
.ride-btn{
  background:var(--accent);color:#fff;border-radius:999px;
  padding:10px 22px;min-height:54px;
  font-family:var(--font-display);font-weight:700;font-size:20px;
  box-shadow:0 5px 0 rgba(74,47,107,.3);
}
.yarn-btn{
  width:54px;height:54px;border-radius:50%;background:var(--panel);
  box-shadow:0 5px 0 rgba(74,47,107,.22);
  display:grid;place-items:center;touch-action:none;
}
.yarn-btn svg{width:36px;height:36px}
.ride-btn:active,.yarn-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,47,107,.3)}
.riding .yarn-btn{display:none}

.bubble{
  position:absolute;right:5%;top:6%;z-index:3;
  display:flex;align-items:center;gap:8px;
  background:#fff;border-radius:22px;padding:8px 14px 8px 10px;
  font-family:var(--font-display);font-weight:600;font-size:clamp(16px,3.2vw,22px);
  box-shadow:0 3px 0 rgba(74,47,107,.2);
  max-width:64%;
  pointer-events:none;
}
.bubble svg{width:34px;height:34px;flex:none}
.bubble::after{
  content:"";position:absolute;left:28px;bottom:-12px;
  border:12px solid transparent;border-top-color:#fff;border-bottom:0;
}

/* care tools: they are picked up and used with a finger */
.care{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.act{
  background:var(--panel);border-radius:22px;padding:8px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 5px 0 rgba(74,47,107,.22);
  font-family:var(--font-display);font-weight:600;font-size:clamp(13px,3.2vw,18px);
  transition:transform .08s ease, box-shadow .08s ease;
  touch-action:none;
}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,47,107,.22)}
.act svg{width:clamp(36px,8vw,56px);height:clamp(36px,8vw,56px)}
.act.need{animation:need 1s ease-in-out infinite;background:#fff}
.act.held svg{opacity:.25}
@keyframes need{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.meter{width:100%;height:12px;border-radius:999px;background:rgba(74,47,107,.14);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;width:50%;transition:width .3s ease}
#m-carrot{background:#ff8a3c}
#m-hay{background:#e0b63a}
#m-water{background:#4db8ff}
#m-brush{background:#ff8fc7}
#m-wash{background:#5fd3c8}
#m-fish{background:#6fb8ff}

/* the three places: meadow, barn, training ground */
.places{
  position:absolute;left:4%;top:5%;z-index:3;
  display:flex;gap:6px;
}
.place{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:58px;padding:6px 8px 5px;border-radius:16px;
  background:var(--panel);box-shadow:0 4px 0 rgba(74,47,107,.22);
  font-family:var(--font-display);font-weight:600;font-size:13px;line-height:1.1;
}
.place svg{width:28px;height:28px}
.place[aria-pressed="true"]{background:var(--ink);color:#fff}
.riding .places{display:none}
.saddle-btn{
  width:54px;height:54px;border-radius:50%;background:var(--panel);
  box-shadow:0 5px 0 rgba(74,47,107,.22);
  display:grid;place-items:center;touch-action:none;
}
.saddle-btn svg{width:36px;height:36px}
.saddle-btn[aria-pressed="true"]{background:var(--ink)}
.saddle-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,47,107,.3)}
.riding .saddle-btn,.in-stall .saddle-btn,.in-bane .yarn-btn{display:none}
/* which round buttons belong to which place */
#fence-btn,#bottle-btn{display:none}
.in-bane #fence-btn{display:grid}
.baby-hungry #bottle-btn{display:grid}
.riding #fence-btn,.riding #bottle-btn{display:none}
/* rain */
.rain{
  position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s ease;
  background-image:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 14px,rgba(120,170,235,.55) 14px 16px,rgba(255,255,255,0) 16px 34px);
  background-size:68px 120px;
}
.raining .rain{opacity:1;animation:rainfall .45s linear infinite}
@keyframes rainfall{to{background-position:-34px 120px}}
.raining .stage{background:linear-gradient(180deg,#9fb4d6,#cdd6ea)}
.after-rain .rainbow{opacity:.9}
/* a short message at the top of the picture */
.toast{
  position:absolute;left:50%;top:-70px;z-index:4;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:#fff;border-radius:999px;padding:8px 18px 8px 10px;
  font-family:var(--font-display);font-weight:600;font-size:18px;
  box-shadow:0 4px 0 rgba(74,47,107,.25);
  transition:top .35s ease;pointer-events:none;
}
.toast.show{top:calc(5% + 64px)}
.toast svg{width:34px;height:34px;flex:none}
/* what the baby or a visitor is asking for */
.wish{
  position:fixed;left:0;top:0;z-index:9;width:44px;height:44px;border-radius:50%;
  background:#fff;box-shadow:0 3px 0 rgba(74,47,107,.25);
  display:grid;place-items:center;pointer-events:none;
}
.wish[hidden]{display:none}
.wish svg{width:30px;height:30px}
/* sticker book */
.book-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border-radius:999px;padding:5px 14px 5px 8px;min-height:44px;
  font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 rgba(74,47,107,.2);
}
.book-btn svg{width:30px;height:30px}
.book{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
  background:rgba(74,47,107,.45);
}
.book[hidden]{display:none}
.book-page{
  width:min(640px,100%);max-height:100%;overflow:auto;
  background:#fffaf2;border-radius:28px;padding:18px 18px 22px;
  box-shadow:0 8px 0 rgba(74,47,107,.3);
}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.book-head h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0}
.book-close{
  border-radius:999px;padding:8px 18px;min-height:44px;background:var(--ink);color:#fff;
  font-family:var(--font-display);font-weight:600;font-size:18px;
}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.stk{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:18px;padding:10px 6px 8px;border:3px dashed rgba(74,47,107,.2);
  font-family:var(--font-display);font-weight:600;font-size:14px;color:rgba(74,47,107,.45);
}
.stk.got{border:3px solid #ffc93c;background:#fff;color:var(--ink)}
/* hair salon */
.salon-label{font-family:var(--font-display);font-weight:600;font-size:15px;align-self:center}
/* night in the barn */
.night .stage{background:linear-gradient(180deg,#221a45,#4a3a7a)}
.night .cloud,.night .rainbow{display:none}
.in-stall .cloud,.in-stall .rainbow{display:none}
.zzz{font-family:var(--font-display);font-weight:700;font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(74,47,107,.5)}
/* the tools stand out in the world now, so the six tool tiles are put away everywhere */
.care{display:none !important}
/* something is wanted and the tools are in the barn: its button calls */
.go-stall #p-stall{animation:callme 1s ease-in-out infinite;box-shadow:0 0 0 4px #ffc93c,0 4px 0 rgba(74,47,107,.25)}
@keyframes callme{50%{transform:scale(1.12)}}
.in-gris .stage-actions{display:none}
.in-gris .cloud{pointer-events:none;animation:none}
.in-gris .cloud.c2{display:none}
.in-gris .snowfall{opacity:0 !important}
#farm .rides-card{grid-template-columns:repeat(2,1fr)}
#farm .ride-pick svg{width:64px;height:64px}
/* the rabbit garden: no riding buttons, no weather buttons */
.in-kanin .stage-actions{display:none}
.in-kanin .cloud{pointer-events:none;animation:none}
.in-kanin .snowfall{opacity:0 !important}
.in-kanin .cloud.c2{display:none}
/* which ride? six big picture buttons over the meadow */
.rides{position:absolute;inset:0;z-index:11;display:grid;place-items:center;background:rgba(74,47,107,.28);border-radius:inherit}
.rides[hidden]{display:none}
.rides-card{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;max-width:92%;
  background:var(--panel);border-radius:28px;box-shadow:0 8px 0 rgba(74,47,107,.25);
}
.ride-pick{
  display:grid;justify-items:center;gap:4px;padding:12px 10px 8px;min-width:92px;border-radius:20px;
  background:#f3ecff;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink);
  box-shadow:0 4px 0 rgba(74,47,107,.2);
}
.ride-pick svg{width:54px;height:54px}
.ride-pick:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,47,107,.2)}
@media (max-width:520px){ .ride-pick{min-width:76px;font-size:13px} .ride-pick svg{width:42px;height:42px} .rides-card{gap:8px;padding:10px} }
/* round buttons that belong to one place only */
#shoe-btn,#show-btn{display:none}
.in-stall #shoe-btn{display:grid}
.in-bane #show-btn{display:grid}
.in-stall #trick-btn,.in-bane #trick-btn,.night #trick-btn,.night #shoe-btn,.riding #show-btn,.riding #trick-btn,.showing #show-btn{display:none}
.stage-actions{flex-wrap:wrap;max-width:92%}
/* themed rides: the sky changes */
.ride-beach .stage{background:linear-gradient(180deg,#8fd3ff,#d9f3ff)}
.ride-rainbow .stage{background:linear-gradient(180deg,#b9c8ff,#ffd9ef)}
.ride-trail .stage{background:linear-gradient(180deg,#bfe6c9,#eaf7e0)}
.ride-beach .cloud,.ride-trail .cloud.c2,.ride-rainbow .cloud.c2{display:none}
/* jump training: level and points */
.score{
  position:absolute;left:4%;top:5%;z-index:3;display:none;align-items:center;gap:8px;
  background:#fff;border-radius:999px;padding:8px 18px 8px 10px;
  font-family:var(--font-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;
  box-shadow:0 4px 0 rgba(74,47,107,.25);pointer-events:none;
}
.score svg{width:30px;height:30px}
.jumping .score{display:flex}
/* bath: only in the barn */
#bath-btn{display:none}
.in-stall #bath-btn{display:grid}
.night #bath-btn{display:none}
#bath-btn[aria-pressed="true"]{background:#bfe9ff}
#fx > .popb{pointer-events:auto;cursor:pointer;touch-action:none}
/* winter: the small cloud makes it snow */
.cloud.c2{z-index:3;cursor:pointer;opacity:.95;animation:bobcloud 3.6s ease-in-out infinite}
.cloud.c2 svg{position:absolute;left:50%;top:70%;width:34px;height:34px;transform:translateX(-50%)}
.in-bane .cloud.c2{pointer-events:none;animation:none}
.riding .cloud.c2{animation:drift 7s linear infinite;animation-delay:-3.5s;pointer-events:none}
.snowfall{
  position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s ease;
  background-image:radial-gradient(circle,#fff 0 4px,rgba(255,255,255,0) 5px),radial-gradient(circle,#fff 0 3px,rgba(255,255,255,0) 4px);
  background-size:90px 90px,60px 60px;background-position:0 0,30px 40px;
}
.winter:not(.in-stall):not(.in-bane):not(.night) .snowfall{opacity:.9;animation:snowing 4s linear infinite}
@keyframes snowing{to{background-position:20px 90px,10px 100px}}
.winter:not(.in-stall):not(.night) .stage{background:linear-gradient(180deg,#b9d3ee,#eef4fb)}
/* flying at night */
.moon{
  position:absolute;right:12%;top:12%;width:76px;height:76px;border-radius:50%;z-index:0;display:none;
  background:#fff6c8;box-shadow:0 0 40px 12px rgba(255,246,200,.45);
}
.nightride .moon{display:block}
/* painting */
.paper{
  display:block;width:100%;aspect-ratio:4/3;border-radius:16px;background:#fff;
  border:4px solid #e7c58f;touch-action:none;cursor:crosshair;
}
.inks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ink{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 0 rgba(74,47,107,.3)}
.ink[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.ink.wipe{display:grid;place-items:center;background:#fff}
.ink.wipe svg{width:28px;height:28px}

/* colour box */
.paint{
  background:var(--panel);border-radius:24px;padding:10px 12px 12px;
  display:flex;flex-direction:column;gap:10px;
}
.paint-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  border-radius:999px;padding:8px 14px;min-height:44px;
  font-family:var(--font-display);font-weight:600;font-size:17px;
  background:rgba(74,47,107,.1);
}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
/* with the rabbit and the pig the panel is theirs: their own two tabs, and no unicorn chips */
.tab.pet{display:none}
.in-kanin .tab.pet,.in-gris .tab.pet{display:inline-block}
.in-kanin .tab:not(.pet),.in-gris .tab:not(.pet){display:none}
.in-kanin .stable,.in-gris .stable{visibility:hidden}
.swatches{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.sw{
  width:48px;height:48px;border-radius:50%;
  border:4px solid #fff;box-shadow:0 2px 0 rgba(74,47,107,.3);
}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.accbtn{
  display:flex;align-items:center;gap:8px;
  border-radius:18px;padding:6px 14px 6px 8px;min-height:52px;
  background:#fff;box-shadow:0 2px 0 rgba(74,47,107,.3);
  font-family:var(--font-display);font-weight:600;font-size:17px;
}
.accbtn svg{width:38px;height:38px}
.accbtn[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.accbtn.locked{background:rgba(74,47,107,.1);box-shadow:none}
.accbtn.locked svg.pic{opacity:.35}
.accbtn .cost{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.accbtn .cost svg{width:20px;height:20px}
.name-row{display:flex;gap:8px;align-items:center;margin-left:auto}
#navn{
  width:150px;min-height:44px;border-radius:999px;border:3px solid rgba(74,47,107,.25);
  background:#fff;padding:4px 14px;font-weight:600;font-size:18px;
  -webkit-user-select:text;user-select:text;
}
#slett{
  min-height:44px;border-radius:999px;padding:4px 14px;
  background:rgba(74,47,107,.1);font-weight:600;font-size:16px;
}
#slett[hidden]{display:none}

/* flying things */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
#fx > *{position:absolute;left:0;top:0;will-change:transform,opacity}

@media (min-width:820px) and (min-aspect-ratio:1/1){
  .game{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(320px,400px);
    grid-template-rows:auto 1fr auto;
    column-gap:16px;
    min-height:560px;
  }
  .top{grid-column:1 / -1}
  .stage{grid-row:2 / 4;min-height:0}
  .care{align-self:start;grid-template-columns:repeat(3,1fr);gap:10px}
  .act{font-size:18px}
  .act svg{width:52px;height:52px}
  .paint{align-self:end}
  .name-row{margin-left:0;width:100%}
  #navn{flex:1;width:auto}
}
@media (max-width:480px){
  .sw{width:42px;height:42px}
  .name-row{margin-left:0;width:100%}
  #navn{flex:1;width:auto}
  .game{padding:10px 12px 14px}
  .tab{padding:8px 11px;font-size:16px}
  .stage-actions{left:3%;bottom:4%;gap:6px}
  .places{left:3%;top:4%;gap:4px}
  .place{min-width:50px;padding:5px 6px 4px;font-size:12px}
  .place svg{width:24px;height:24px}
  .saddle-btn{width:46px;height:46px}
  .saddle-btn svg{width:30px;height:30px}
  .bubble{max-width:50%}
  /* on a phone the picture gets room first; the colour box is reached by scrolling down */
  .game{height:auto;min-height:100%}
  .stage{flex:none;height:56vh;min-height:340px}
  .toast{font-size:15px}
  .care{gap:5px}

  .bubble{right:3%;max-width:56%;font-size:15px;padding:6px 10px 6px 8px}
  .bubble svg{width:26px;height:26px}
}
/* a phone lying down: the picture fills the screen, the tools sit in a narrow column on the right
   (the colour box is below them; that column scrolls, the picture stays put) */
@media (orientation:landscape) and (max-height:520px){
  .game{
    display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-auto-rows:min-content;align-items:start;
    height:auto;min-height:100%;max-width:none;
    padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));
    column-gap:8px;row-gap:6px;
  }
  .stage{
    grid-column:1;grid-row:1 / span 3;position:sticky;top:6px;
    flex:none;height:calc(100vh - 12px);height:calc(100dvh - 12px);min-height:0;border-radius:20px;
  }
  .top{grid-column:2;grid-row:1;gap:6px}
  .top h1{display:none}
  .stars{font-size:16px;padding:4px 10px 4px 6px}
  .stars svg{width:20px;height:20px}
  .book-btn{padding:4px 8px}
  .book-btn svg{width:24px;height:24px}
  .stable{margin-left:0;gap:6px;flex-wrap:wrap}
  .chip{width:34px;height:34px;border-width:4px}
  .care{grid-column:2;grid-row:2;grid-template-columns:repeat(3,1fr);gap:5px}
  .act{padding:5px 2px 6px;border-radius:14px;font-size:11px;gap:2px;box-shadow:0 3px 0 rgba(74,47,107,.22)}
  .act svg{width:34px;height:34px}
  .paint{grid-column:2;grid-row:3;padding:8px;border-radius:18px;gap:8px}
  .tab{padding:6px 9px;font-size:14px}
  .sw{width:36px;height:36px}
  .name-row{margin-left:0;width:100%}
  #navn{flex:1;width:auto;min-width:0}
  .places{left:2%;top:4%;gap:4px}
  .place{min-width:48px;padding:4px 6px 3px;font-size:12px}
  .place svg{width:22px;height:22px}
  .stage-actions{left:2%;bottom:4%;gap:6px}
  .ride-btn{padding:6px 14px;min-height:44px;font-size:16px}
  .yarn-btn,.saddle-btn{width:44px;height:44px}
  .yarn-btn svg,.saddle-btn svg{width:28px;height:28px}
  .bubble{right:2%;max-width:52%;font-size:15px;padding:6px 10px 6px 8px}
  .bubble svg{width:26px;height:26px}
  .rides-card{gap:8px;padding:10px}
  .ride-pick{padding:8px 8px 6px;min-width:84px;font-size:13px}
  .ride-pick svg{width:40px;height:40px}
  .book{padding:8px}
  .book-page{padding:10px 14px 12px;border-radius:20px}
  .book-head{margin-bottom:8px}
  .book-head h2{font-size:20px}
  .paper{width:auto;max-width:100%;height:calc(100vh - 150px);height:calc(100dvh - 150px);margin:0 auto}
  .inks{margin-top:8px;justify-content:center}
  .ink{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){
  .act.need{animation:none}
  .rainbow{transition:none}
}

  // --- saved state -----------------------------------------------------------
  function newUnicorn(i){
    return {
      name: "",
      body: COLORS.body[i % COLORS.body.length],
      mane: COLORS.mane[i % COLORS.mane.length],
      horn: COLORS.horn[0],
      cat: COLORS.cat[(i + 1) % COLORS.cat.length],
      acc: {},
      carrot: 55, hay: 60, water: 35, brush: 65, wash: 80, fish: 50,
      saddle: false,                 // the saddle is on its back
      rack: 0, trough: 0,            // hay in the barn's rack and water in its trough, 0 to 100
      dirt: 2,                       // dirty straw piles in the barn, 0 to 3
      asleep: false,                 // tucked in for the night
      milk: 60,                      // the baby's bottle, 0 to 100
      hoof: "",                      // painted hoof colour, "" = follows the mane
      braid: false, braidN: 0, clips: false, glitter: false,   // hair salon; braidN = pieces of mane braided so far, 0 to 4
      course: [],                    // the child's own jump course: { x, h }
      shoes: [0, 0, 0, 0], shoeWear: 0,   // horseshoes on the four legs, and how many rides they have done
      rosette: false,                // won at the show
      t: Date.now()
    };
  }
  function fresh(){ return { list: [newUnicorn(0)], cur: 0, stars: 0, baby: false, stickers: {} }; }
  function load(hot){
    var s = null;
    if (hot && hot.list && hot.list.length) s = hot;
    if (!s) {
      try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){ s = null; }
    }
    if (!s || !s.list || !s.list.length) s = fresh();
    if (!(s.cur >= 0 && s.cur < s.list.length)) s.cur = 0;
    s.stars = s.stars | 0;
    s.baby = !!s.baby;
    s.winter = !!s.winter; s.snowN = Math.max(0, Math.min(3, +s.snowN || 0)); s.snowNose = !!s.snowNose;

    s.foalCare = Math.max(0, Math.min(200, +s.foalCare || 0)); s.foalDirty = !!s.foalDirty;   // the baby
    s.level = Math.max(1, Math.floor(+s.level || 1)); s.best = Math.max(0, +s.best || 0);   // jump training
    if (typeof s.art !== "string" || s.art.indexOf("data:image/") !== 0) s.art = "";

      if (typeof u.dirt !== "number") u.dirt = 2;

      if (typeof u.hoof !== "string") u.hoof = "";
      if (typeof u.braidN !== "number") u.braidN = u.braid ? 4 : 0;
      if (!Array.isArray(u.course)) u.course = [];

      var tx = yarn.p.x + side * 0.75, tz = yarn.p.z;
      var dx = tx - cat.position.x, dz = tz - cat.position.z, d = Math.hypot(dx, dz);

        cat.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
      } else if (yarn.phase === "run") {
        yarn.phase = "bat"; yarn.t = 0;
        yarn.vx = -side * 3.2;
        cat.rotation.y = Math.atan2(-side, 0.4) - Math.PI / 2;
        burst("heart", P.cat(), 4);
        tone([1047, 880, 1175]);
        act.catHop = 0.7;
        addStars(1); save(); renderMood();
        award("yarn");
      }
    } else if (yarn.phase === "bat") {
      b.x += yarn.vx * dt; yarn.vx *= Math.pow(0.12, dt);
      yarnBall.rotation.z -= yarn.vx * dt * 3;
      if (yarn.t > 1.3) { yarn.phase = "home"; yarn.t = 0; }
    } else if (yarn.phase === "home") {
      var hx = CAT_HOME.x - cat.position.x, hz = CAT_HOME.z - cat.position.z, hd = Math.hypot(hx, hz);

        cat.position.x += hx / hd * hs; cat.position.z += hz / hd * hs;
        cat.rotation.y = Math.atan2(hx, hz) - Math.PI / 2;
      } else { yarnBall.scale.setScalar(1); clearYarn(); }
    }
  }

  // --- riding: the unicorn gallops, steer it up and down to catch stars. No way to lose.
  // In the meadow it is a flying ride; on the training ground it is a jumping course.
  function startRide(kind){
    if (ride || asleep() || place === "stall") return;
    if (!cur().saddle) {                      // no saddle, no ride
      showHint("saddle", $("saddle-btn"), P.back());
      return;
    }
    if (yarn) { yarnBall.scale.setScalar(1); clearYarn(); }
    // the meadow has six rides to choose from; the training ground is always jumping
    kind = place === "bane" ? "jump" : (RIDE_KINDS[kind] ? kind : "fly");
    sfx("neigh");
    ride = { mode: kind === "jump" || kind === "race" ? kind : "fly", kind: kind, t: 0, y: 0, vy: 0, target: 0, next: 0.4,
             stars: [], fences: [], props: [], sent: 0, cleared: 0, got: 0, rot0: uni.rotation.y, plan: null,
             nextProp: 0, goal: null, halt: false, end: 0, bump: 0, rings: 0 };
    var own = (cur().course || []).slice().sort(function(a, b){ return a.x - b.x; });
    if (own.length) ride.plan = own.map(function(c){ return FENCE_H[c.h]; });   // left to right, as the child placed them
    if (ride.mode === "jump") {
      // each level has more fences, and they come faster; the points count up on the way
      ride.next = 1.2;
      ride.level = state.level || 1;
      ride.total = Math.min(14, 5 + ride.level);
      ride.points = 0;
      game.classList.add("jumping");
      showScore();
    }
    // with wings on, the star ride is a flight through the night sky
    ride.night = kind === "fly" && !!cur().acc.wings && unlocked(ACC[2]);
    game.classList.toggle("nightride", ride.night);
    if (kind !== "jump" && kind !== "fly") {
      // a themed ride leaves the meadow behind: its own sky, ground and things along the way
      game.classList.add("ride-" + kind);
      S.eng.visible = false;
      bowl.visible = false;
      if (kind === "beach") { M.grass.color.set("#f6dfa6"); sea.visible = true; flowers.forEach(function(f){ f.visible = false; }); }
      if (kind === "trail") M.grass.color.set("#8fcf7c");
      if (kind === "rainbow") { game.classList.add("after-rain"); flowers.forEach(function(f){ f.visible = false; }); }
      if (kind === "post") U.parcel.visible = true;
      if (kind === "race") startRace();
    }
    game.classList.add("riding");
    U.rider.visible = true;
    renderLook(); renderMood();
    tone([523, 659, 784]);
  }
  function stopRide(){
    if (!ride) return;
    var jumping = ride.mode === "jump", kind = ride.kind;
    if (kind === "fly" && ride.got > 0) award("ride");
    if (ride.night && ride.got > 0) award("nightfly");
    game.classList.remove("nightride");
    game.classList.remove("jumping");
    ["trail", "race", "rainbow", "beach", "post"].forEach(function(k){ game.classList.remove("ride-" + k); });
    if (kind === "rainbow") game.classList.remove("after-rain");
    ride.stars.forEach(function(s){ scene.remove(s); });
    ride.fences.forEach(function(f){ scene.remove(f); });
    ride.props.forEach(function(p){ scene.remove(p); });
    if (ride.goal) scene.remove(ride.goal);
    if (ride.rivals) ride.rivals.forEach(function(r){ r.m.visible = false; r.m.rotation.y = -0.5; r.m.position.y = 0; });
    sea.visible = false;
    bowl.visible = true;
    U.parcel.visible = false;
    ride = null;
    game.classList.remove("riding");
    S.eng.visible = place === "eng";
    applyWinter();                             // the meadow's own ground and flowers again
    U.rider.visible = false;
    U.legs.forEach(function(l){ l.rotation.z = 0; });
    // a ride makes the unicorn hungry, thirsty and muddy (jumping on sand is less muddy, and the sea washes)
    var u = cur();
    u.carrot = Math.max(10, u.carrot - 8);
    u.hay = Math.max(10, u.hay - 10);
    u.water = Math.max(10, u.water - 15);
    if (kind !== "beach") u.wash = Math.max(10, u.wash - (jumping ? 30 : 55));
    // horseshoes last five rides
    if (u.shoes && u.shoes.every(function(s){ return s; })) {
      u.shoeWear = (u.shoeWear || 0) + 1;
      if (u.shoeWear >= 5) {
        u.shoes = [0, 0, 0, 0]; u.shoeWear = 0;
        toast("Skoene er slitt. Nye sko i stallen!", "shoe");
      }

    u.t = Date.now();
    save(); renderLook(); renderMood();
    tone([784, 659, 523]);
  }
  // the training ground: fences come one by one, a tap makes the unicorn jump
  var FENCES = 8;
  function hop(){
    if (!ride || ride.mode !== "jump" || ride.y > 0) return;
    ride.vy = 8.2; ride.y = 0.001;
    tone([660, 880]);
    sfx("whoosh");
  }
  function stepJump(dt){
    ride.t += dt;
    if (ride.y > 0) {
      ride.vy -= 19 * dt;
      ride.y = Math.max(0, ride.y + ride.vy * dt);
      if (ride.y === 0) { ride.vy = 0; sfx("thud"); }       // the landing
    }
    var total = ride.total;
    // faster for every level, and a little faster for every fence in the run
    var fast = Math.min(2.2, (1 + 0.12 * (ride.level - 1)) * (1 + 0.04 * ride.sent));
    if (ride.sent < total && ride.t >= ride.next) {
      // the child's own fences set the heights; otherwise low ones first, taller ones from level 2 and 3
      var fh = ride.plan ? ride.plan[ride.sent % ride.plan.length] : FENCE_H[(ride.sent + ride.level) % Math.min(3, ride.level)];
      var f = makeFence(fh);
      f.position.set(LOOK.x + view.halfW + 1.2, 0, 0);
      scene.add(f); ride.fences.push(f);
      ride.sent += 1;
      ride.next = ride.t + Math.max(1.15, 2.3 / fast);
    }
    var speed = view.halfW * 2 / 2.6 * fast;
    var cx = uni.position.x + 0.2 * RIDE_SCALE;
    ride.fences = ride.fences.filter(function(f){
      f.position.x -= speed * dt;
      var d = f.userData;
      // the baby runs along and jumps every fence too
      if (state.baby && !d.babyDone && f.position.x <= foal.position.x + 0.9) { d.babyDone = true; act.foalHop = 0.7; foalPlay.amp = 3.2; }
      if (!d.done && f.position.x <= cx) {
        d.done = true;
        if (ride.y > d.h - 0.1) {             // over it
          ride.cleared += 1;
          ride.points += 10 * ride.level;
          showScore();
          award("jump");
          addStars(1);
          $("stars").textContent = state.stars;
          burst("star", screenOf(tmp2.set(f.position.x, d.h + 0.6, 0)), 5);
          tone([988, 1319]);
        } else {                              // a pole comes down, nothing is lost
          d.fall = 0.001;
          tone([196, 147], "square", .12);
        }
      }
      if (d.fall) {
        d.fall += dt;
        d.poles.forEach(function(p, i){
          p.position.y = Math.max(0.08, p.userData.y0 - 5 * d.fall * d.fall);
          p.position.x = -Math.min(0.9, d.fall * (1.4 + i * 0.5));
          if (p.position.y > 0.09) p.rotation.z += dt * 5;
        });
      }
      if (f.position.x < LOOK.x - view.halfW - 1.6) { scene.remove(f); return false; }
      return true;
    });
    if (ride.sent >= total && !ride.fences.length) {
      burst("star", P.head(), 12);
      tone([523, 659, 784, 1047, 1319]);

      var pts = ride.points, up = ride.cleared >= total - 1;
      var record = pts > (state.best || 0);
      if (record) state.best = pts;
      if (up) state.level = ride.level + 1;
      stopRide();
      toast(up ? pts + " poeng! Nivå " + state.level + "!" : pts + " poeng! Prøv igjen!", record ? "star" : "flag");
      save();
    }
  }
  function showScore(){
    $("score-text").textContent = "Nivå " + ride.level + " · " + ride.points + " poeng";
  }
  var RIDE_SCALE = 0.5, RIDE_X = -1.9;
  function rideTop(){ return LOOK.y + view.halfH * 0.92; }

    if (!ride || ride.halt || ride.mode === "race") return;
    var p = sideAt(x, y);
    if (!p) return;
    var max = Math.max(0, rideTop() - UNI_TOP * RIDE_SCALE);
    ride.target = Math.max(0, Math.min(max, p.y - UNI_MID * RIDE_SCALE));
  }
  // --- the rides in the meadow ---------------------------------------------------
  // Stars (the old one), the forest, a race, the rainbow, the beach and the parcel.
  // All but the race are steered with a finger, up and down. Nothing can be lost.
  var RIDE_KINDS = { fly: 1, trail: 1, race: 1, rainbow: 1, beach: 1, post: 1 };
  var RING_NOTES = [523, 587, 659, 698, 784, 880, 988, 1047];
  var RACE_D = 55;
  function addItem(m, y, right){
    m.position.set(right + 0.8, y, 0);
    scene.add(m); ride.stars.push(m);
    return m;
  }
  function addProp(m, x, y, z){
    m.position.set(x, y, z);
    scene.add(m); ride.props.push(m);
    return m;
  }
  // the next thing on the way: something to catch, or something to get over
  function spawnItem(right){
    var k = ride.kind, top = rideTop(), r = Math.random();
    if (k === "fly" || k === "post") {
      addItem(new T.Mesh(GEO.star, M.gold), 0.7 + Math.random() * (top - 1.2), right);
      ride.next = ride.t + (ride.night ? 0.45 : (k === "post" ? 1.0 : 0.7)) + Math.random() * 0.5;   // the night sky is full of stars
    } else if (k === "trail") {
      if (r < 0.4) addItem(r < 0.16 ? makeLog() : (r < 0.3 ? makeRock() : makeMud()), 0, right);
      else if (r < 0.75) addItem(makeApple(), 1.7 + Math.random() * Math.max(0.3, top - 3.4), right);
      else addItem(makeBloom(), 0.75, right);
      ride.next = ride.t + 0.8 + Math.random() * 0.5;
    } else if (k === "beach") {
      if (r < 0.25) addItem(makeWave(), 0, right);
      else if (r < 0.7) addItem(makeShell(), 0.3, right);
      else addItem(makeStarfish(), 1.8 + Math.random() * Math.max(0.3, top - 3.6), right);
      ride.next = ride.t + 0.75 + Math.random() * 0.5;
    } else if (k === "rainbow") {
      var n = ride.rings++;
      addItem(makeRing(n), 1.5 + Math.max(0.2, top - 3.4) * (0.5 + 0.5 * Math.sin(n * 0.9)), right);
      ride.next = ride.t + 1.35;
    }
  }
  // trees, bushes and clouds drifting past behind the unicorn
  function spawnProp(x){
    var k = ride.kind, r = Math.random(), top = rideTop();
    if (k === "trail") {
      // mostly pines, with stumps, mushrooms, a fox now and then, and birds between the trees
      if (r < 0.62) addProp(makePine(), x, 0, -2.3 - Math.random() * 2.8);
      else if (r < 0.8) addProp(makeStump(), x, 0, -1.5 - Math.random() * 0.7);
      else if (r < 0.88) addProp(makeFox(), x, 0, -1.5 - Math.random() * 0.5);
      else addProp(makeBird(), x, 2.2 + Math.random() * (top - 2.5), -1.6 - Math.random() * 1.5);
      return 0.42 + Math.random() * 0.4;
    }
    if (k === "beach") {
      // palms and sandcastles on the sand, boats out on the water, gulls above
      if (r < 0.35) addProp(makePalm(), x, 0, -1.5 - Math.random() * 0.8);
      else if (r < 0.6) addProp(makeSandcastle(), x, 0, -1.5 - Math.random() * 0.6);
      else if (r < 0.8) addProp(makeBoat(), x, 0.05, -6 - Math.random() * 5);
      else addProp(makeBird(), x, 2.4 + Math.random() * (top - 2.8), -1.6 - Math.random() * 2);
      return 0.9 + Math.random() * 0.8;
    }
    if (k === "post" || k === "race") {
      if (r < 0.3) addProp(makeBush(), x, 0, -1.7 - Math.random() * 2.2);
      else if (r < 0.55) addProp(makePine(), x, 0, -2.0 - Math.random() * 2.2);
      else if (r < 0.8) addProp(makeFencePiece(), x, 0, -1.5);
      else if (r < 0.9 && k === "post") addProp(makeMailbox(), x, 0, -1.4);
      else addProp(makeBird(), x, 2.4 + Math.random() * (top - 2.8), -1.6 - Math.random() * 2);
      return 0.7 + Math.random() * 0.7;
    }
    if (k === "rainbow") {
      if (r < 0.75) addProp(makeCloud(), x, 1 + Math.random() * top, -1.6 - Math.random() * 2.5);
      else if (r < 0.9) addProp(makeBird(), x, 1.5 + Math.random() * (top - 1.5), -1.5 - Math.random() * 2);
      else { var st = addProp(new T.Mesh(GEO.star, M.gold), x, 1.5 + Math.random() * top, -2.5 - Math.random() * 2); st.scale.setScalar(0.5); }
      return 0.5 + Math.random() * 0.5;
    }
    return 1e9;
  }
  // birds flap and bob as they drift past
  function flap(p){
    if (p.userData.bird === undefined) return;
    var w = Math.sin(time * 10 + p.userData.bird) * 0.6;
    p.children[1].rotation.x = -0.4 - w; p.children[2].rotation.x = 0.4 + w;
    p.position.y += Math.sin(time * 2 + p.userData.bird) * 0.004;
  }
  function seedProps(speed){
    // some scenery is already there when the ride begins
    var left = LOOK.x - view.halfW, right = LOOK.x + view.halfW, x = left;
    while (x < right + 1) {
      var gap = spawnProp(x);
      if (gap > 1e8) break;
      x += gap * speed;
    }
  }
  function gotItem(m){
    var d = m.userData, p = screenOf(m.position), n = ride.night ? 2 : 1, u = cur();
    if (d.kind === "ring") { tone([RING_NOTES[d.n % 8]], "sine"); burst("star", p, 6); }
    else if (d.kind === "apple") { u.carrot = Math.min(100, u.carrot + 4); tone([659, 784]); burst("heart", p, 3); }
    else if (d.kind === "starfish") { n = 2; tone([988, 1319, 1568]); burst("star", p, 6); }
    else { tone([988, 1319]); burst("star", p, 4); }
    ride.got += 1;
    addStars(n);
    $("stars").textContent = state.stars;
  }
  // too low over something on the ground: a stumble, a splash of mud, or a wave to splash through
  function bumpInto(m){
    var d = m.userData, p = screenOf(tmp2.copy(m.position).setY(0.4)), u = cur();
    if (d.kind === "wave") {
      burst("bubble", p, 8); tone([880, 1175]);
      u.wash = Math.min(100, u.wash + 8);              // sea water washes
      addStars(1); $("stars").textContent = state.stars;
    } else if (d.kind === "mud") {
      burst("bubble", p, 4); tone([220, 196], "square", .1);
      u.wash = Math.max(10, u.wash - 4);
    } else {
      ride.bump = 0.5;
      tone([196, 147], "square", .12);
    }
  }
  // the rainbow ends at a castle in the clouds; the parcel ends at a friend's house
  function arrive(){
    var k = ride.kind;

      ride.target = ride.goalY;

      burst("star", P.head(), 14);
    } else if (k === "post") {
      ride.target = 0;
      var who = (state.posts || 0) % 2 ? "duck" : "bunny", m = friendModels[who];
      m.position.set(ride.goal.position.x - 1.3, 0, 0.5);

      ride.rivals = [{ m: m }]; ride.who = who;
      U.parcel.visible = false;
      burst("heart", screenOf(tmp2.copy(m.position).setY(1.2)), 8);
      tone([784, 988, 1175, 1568]);
    }
  }
  function finishRide(){
    var k = ride.kind, got = ride.got, who = ride.who, place = ride.place;
    stopRide();
    if (k === "rainbow") { addStars(5); award("rainbow"); toast("Skyslottet!", "rainbow"); }
    else if (k === "post") {
      state.posts = (state.posts || 0) + 1;
      addStars(3); award("post");
      toast((who === "duck" ? "Anden" : "Kaninen") + " fikk pakken!", "parcel");
    }
    else if (k === "trail") { if (got > 0) award("trail"); toast("Fin tur i skogen!", "tree"); }
    else if (k === "beach") { if (got > 0) award("beach"); toast(got + " skjell og sjøstjerner!", "shell"); }
    else if (k === "race") {
      addStars([5, 3, 2][place - 1] || 2); award("race");
      toast(place + ". plass!", place === 1 ? "rosette" : "flag");
    }
    save(); renderMood();
  }
  function stepRide(dt){
    if (ride.mode === "jump") { stepJump(dt); return; }
    if (ride.mode === "race") { stepRace(dt); return; }
    var k = ride.kind;
    ride.t += dt;
    ride.y += (ride.target - ride.y) * Math.min(1, dt * 7);
    if (ride.bump > 0) ride.bump = Math.max(0, ride.bump - dt);
    var speed = view.halfW * 2 / 2.6, moving = ride.halt ? 0 : speed;
    var right = LOOK.x + view.halfW, left = LOOK.x - view.halfW;
    if (!ride.seeded) { ride.seeded = true; seedProps(speed); }

      if (f.position.x < -9) f.position.x += 18;

  }
  // --- the race: tap, tap, tap to gallop past the bunny and the duck ------------
  function startRace(){

    ride.rivals = [{ m: friendModels.bunny, d: 0, base: 2.9, z: 1.75 }, { m: friendModels.duck, d: 0, base: 2.5, z: 2.45 }];
    ride.rivals.forEach(function(r){ r.m.visible = true; r.m.rotation.y = 0; r.m.position.set(RIDE_X, 0, r.z); });

  function raceTap(){
    if (!ride || ride.mode !== "race" || ride.halt) return;

  }
  function stepRace(dt){
    ride.t += dt;
    var rivals = ride.rivals;
    if (ride.halt) {
      ride.end -= dt;
      rivals.forEach(function(r, i){ r.m.position.y = Math.abs(Math.sin(time * 8 + i)) * 0.25; });
      if (ride.end <= 0) finishRide();
      return;
    }
    if (!ride.seeded) { ride.seeded = true; seedProps(3); }
    var allIn = rivals.every(function(r){ return r.done; });
    ride.v = Math.max(allIn ? 3.2 : 0.9, ride.v - ride.v * 0.9 * dt);       // it slows down without taps, but never stops
    var step = ride.v * dt;
    ride.dist += step;
    var ahead = 0;
    rivals.forEach(function(r, i){
      // the others stay close: a little slower when in front, a little faster when behind
      var v = Math.max(1.6, Math.min(4.6, r.base + 0.3 * (ride.dist - r.d) + Math.sin(ride.t * 0.7 + i * 2) * 0.4));
      r.d += (r.done ? 2 : v) * dt;
      if (!r.done && r.d >= RACE_D) { r.done = true; ride.crossed += 1; }
      if (r.d > ride.dist) ahead += 1;
      r.m.position.x = uni.position.x + (r.d - ride.dist);
      r.m.position.y = Math.abs(Math.sin(time * 12 + i)) * 0.18;
      r.m.visible = Math.abs(r.m.position.x - LOOK.x) < view.halfW + 1.5;
    });
    var text = "Du er nr. " + (ahead + 1);
    if (text !== ride.shown) { ride.shown = text; $("score-text").textContent = text; }
    // the finish line comes into view
    ride.goal.position.x = uni.position.x + (RACE_D - ride.dist);
    ride.goal.visible = ride.goal.position.x < LOOK.x + view.halfW + 2;
    // the ground moves as fast as the unicorn runs
    var left = LOOK.x - view.halfW;
    ride.nextProp -= step;
    if (ride.nextProp <= 0) ride.nextProp = spawnProp(LOOK.x + view.halfW + 1.5) * 3;
    ride.props = ride.props.filter(function(p){
      flap(p);
      p.position.x -= step;
      if (p.position.x < left - 4) { scene.remove(p); return false; }
      return true;
    });
    flowers.forEach(function(f){
      f.position.x -= step;
      if (f.position.x < -9) f.position.x += 18;
    });
    if (ride.dist >= RACE_D) {
      ride.place = 1 + ride.crossed;
      ride.halt = true; ride.end = 2.6;
      $("score-text").textContent = ride.place + ". plass!";
      burst("star", P.head(), 14);
      tone([523, 659, 784, 1047, 1319]);
    }
  }

  // --- playing with the baby: it follows a finger, fetches its ball, is groomed, grows and learns tricks ---
  var foalPlay = { tx: null, tz: 0, hold: false, wait: 0, walked: 0, rot: -0.7, amp: 1, n: 0, fetch: false };

  // --- everything above that moves or keeps time ---------------------------------------
  function stepExtras(dt, k){
    var u = cur(), sleeping = !!u.asleep && !ride, quiet = ride || sleeping;

    // the baby: grows in, follows, hops, sleeps, drinks
    if (state.baby) {
      foal.visible = true;
      // it grows a little with all the care it gets
      var grown = FOAL_SCALE * (1 + 0.3 * Math.min(1, (state.foalCare || 0) / 60));
      var fs = ride ? FOAL_SCALE * 0.6 : grown;
      foal.scale.setScalar(ease(foal.scale.x, fs, dt * 4));
      if (quiet) { foalPlay.tx = null; foalPlay.hold = false; foalPlay.fetch = false; }
      var trot = false;
      if (foalPlay.tx !== null) {
        // running after a finger, or to its ball
        var fdx = foalPlay.tx - foal.position.x, fdz = foalPlay.tz - foal.position.z, fd = Math.hypot(fdx, fdz);
        if (fd > 0.12) {
          var fstep = Math.min(fd, 4.5 * dt);
          foal.position.x += fdx / fd * fstep; foal.position.z += fdz / fd * fstep;
          foalPlay.rot = Math.atan2(fdx, fdz) - Math.PI / 2;
          trot = true;
          if (foalPlay.hold) {
            foalPlay.walked += fstep;
            if (foalPlay.walked > 8) {              // a good run earns a star
              foalPlay.walked = 0;
              addStars(1); renderMood(); growFoal(1); award("follow");
              burst("star", screenOf(local(F.head, 0.3, 1.0, 0)), 4);
              tone([988, 1319]);
            }
          }
        } else if (!foalPlay.hold && !foalPlay.fetch) {
          // stays a moment where the finger let go, then trots home
          foalPlay.wait -= dt;
          if (foalPlay.wait <= 0) foalPlay.tx = null;
        }
        foal.rotation.y = foalPlay.rot;
      } else {
        foal.position.x = ease(foal.position.x, ride ? -0.4 : FOAL_HOME.x, k);
        foal.position.z = ease(foal.position.z, ride ? 0.7 : FOAL_HOME.z, k);
        foalPlay.rot = ease(foalPlay.rot, ride ? 0 : -0.7, k);
        foal.rotation.y = foalPlay.rot;
        trot = !ride && Math.hypot(foal.position.x - FOAL_HOME.x, foal.position.z - FOAL_HOME.z) > 0.3;
      }
      // the spin trick turns it all the way round
      if (act.foalSpin > 0) {
        act.foalSpin = Math.max(0, act.foalSpin - dt);
        foal.rotation.y = foalPlay.rot + act.foalSpin / 0.8 * Math.PI * 2;
      }
      var fh = 0;
      if (act.foalHop > 0) {
        act.foalHop = Math.max(0, act.foalHop - dt);
        var fj = 1 - act.foalHop / 0.7;
        fh = Math.abs(Math.sin(fj * Math.PI * 2)) * 0.3 * (1 - fj * 0.6) * foalPlay.amp;
        if (act.foalHop === 0) foalPlay.amp = 1;
      }
      act.foalLie = ease(act.foalLie, sleeping ? 1 : 0, dt * 3);
      foal.position.y = fh + (trot ? Math.abs(Math.sin(time * 15)) * 0.05 : 0) + (ride ? Math.abs(Math.sin(time * 15)) * 0.06 + (ride.mode === "jump" ? 0 : ride.y * 0.45) : 0) - 0.52 * act.foalLie * foal.scale.x / FOAL_SCALE;
      F.legs.forEach(function(l, i){
        var target = ride || trot ? Math.sin(time * 15 + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.7 : (i < 2 ? 1.35 : -1.35) * act.foalLie;
        l.rotation.z = ride || trot ? target : ease(l.rotation.z, target, dt * 12);
      });
      F.mud.forEach(function(m){ m.visible = !!state.foalDirty && !ride; });
      if (act.foalMunch > 0) act.foalMunch -= dt;
      F.head.rotation.z = ease(F.head.rotation.z, act.foalMunch > 0 ? 0.35 + Math.sin(time * 18) * 0.08 : (sleeping ? -0.5 : Math.sin(time * 1.5) * 0.05), dt * 10);
      var flid = sleeping || act.blink > 0 ? 0.1 : 1;
      F.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, flid, dt * 22); });
    }
    // little markers that show what the baby or a visitor wants
    var wf = $("wish-foal"), hungry = state.baby && !quiet && !onFarm() && u.milk < 45;
    game.classList.toggle("baby-hungry", !!state.baby && !quiet && u.milk < 70);   // the bottle is only out when it is wanted
    wf.hidden = !hungry;
    if (hungry) {
      var a = screenOf(local(F.head, 0.2, 1.6 + Math.sin(time * 3) * 0.1, 0));
      wf.style.transform = "translate(" + (a[0] - 22) + "px," + (a[1] - 44) + "px)";
    }

    // rain: clouds open, puddles grow, a rainbow follows
    if (weather.rain > 0) {
      weather.rain -= dt;
      if (weather.rain <= 0 || place !== "eng" || ride) {
        weather.rain = 0;

      weather.rainbow -= dt;

    }

      var want = weather.rain > 0 ? 1 : (weather.rainbow > 0 || p.userData.keep > 0 ? p.userData.size : 0);

      else if (p.userData.keep > 0) { p.userData.keep -= dt; want = 1; }
      p.userData.size = ease(p.userData.size, want, dt * (want ? 0.5 : 0.8));
      var s = Math.max(0.001, p.userData.size * 0.95);
      p.scale.set(s, s * 0.7, 1);
    });

    // apples: fall, lie on the grass, and grow back after being eaten
    if (act.tree > 0) act.tree -= dt;
    tree.userData.crown.rotation.z = act.tree > 0 ? Math.sin(time * 30) * 0.06 : 0;

      if (a.st === "fall") {
        a.vy -= 14 * dt;

        a.mesh.position.z = ease(a.mesh.position.z, a.land.z, dt * 3);

        m.position.y = hopY;

        m.position.y = Math.abs(Math.sin(time * 2.2)) * 0.05;

      } else {
        m.position.x += dt * 3.6;

    var wr = $("wish-friend"), asking = !!friend && friend.phase === "wait";

    // music: a tapped block pings, and the unicorn dances

            p.pit = Math.min(100, p.pit + 4);

      if (pg.t <= 0 || p[tr2] <= 0 || p[key] >= 100) {

    } else if (pg.mode === "roll") {

    var sc = ease(uni.scale.x, ride ? RIDE_SCALE : 1, k);
    uni.scale.setScalar(sc);
    uni.position.x = ease(uni.position.x, ride ? RIDE_X : HOME_X, k);
    if (ride) uni.rotation.y = ease(uni.rotation.y, 0, k);
    var jump = 0;
    if (act.joy > 0) {
      act.joy = Math.max(0, act.joy - dt);
      var j = 1 - act.joy / 0.8;
      jump = Math.abs(Math.sin(j * Math.PI * 2)) * 0.55 * (1 - j * 0.6);
    }
    var going = ride && !ride.halt;                 // galloping; not when it has arrived somewhere
    var gallop = going ? Math.abs(Math.sin(time * 13)) * 0.12 : 0;
    // hoofbeats on the ground: not on the two rides through the sky, and not in the middle of a jump
    if (going && ride.kind !== "fly" && ride.kind !== "rainbow" && !(ride.y > 0)) {
      var beat = Math.floor(time * 13 / Math.PI);
      if (beat !== SND.beat) { SND.beat = beat; sfx("clop"); }
    }
    var tp = trickPose(dt);                         // a trick bends it for a moment
    // asleep: it lies down with its legs stretched out
    var sleeping = !!u.asleep && !ride;
    act.lie = ease(act.lie, sleeping ? 1 : 0, dt * 3);
    uni.position.y = (ride ? ride.y : 0) + jump + gallop - 1.2 * act.lie + tp.dy;
    uni.rotation.z = (going ? Math.sin(time * 13) * 0.05 : 0) + tp.rz - (ride && ride.bump > 0 ? Math.sin(ride.bump * 25) * 0.22 : 0);
    uni.rotation.y += tp.spin;
    if (sleeping) {
      act.zzz -= dt;
      if (act.zzz <= 0) { act.zzz = 1.7; zzz(); }
    }

    // breathing, tail, legs
    var wag = ride ? 9 : 2.2;
    U.tail.rotation.z = Math.sin(time * wag) * (ride ? 0.3 : 0.12) + (ride ? 0.5 : 0);
    U.tail.rotation.y = Math.sin(time * 1.6) * 0.25;
    if (ride && ride.mode === "jump" && ride.y > 0) {
      // in the air over a fence: front legs tucked forward, hind legs stretched back
      U.legs.forEach(function(l, i){ l.rotation.z = ease(l.rotation.z, i < 2 ? 0.95 : -0.95, dt * 14); });
    } else if (going) {
      U.legs.forEach(function(l, i){ l.rotation.z = Math.sin(time * 13 + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.7; });
    } else {
      U.legs.forEach(function(l, i){
        var paw = act.idle === "paw" && i === 0 && !sleeping ? Math.max(0, Math.sin(act.idleT * 12)) * 0.7 : 0;
        var rest = (i < 2 ? 1.35 : -1.35) * act.lie;
        l.rotation.z = ease(l.rotation.z, paw + rest + tp.leg[i], dt * 14);
      });
    }
    U.wings.forEach(function(w, i){
      var sg = i ? -1 : 1;
      w.rotation.x = sg * (ride ? 0.2 + Math.sin(time * 15) * 0.55 : 0.1 + Math.sin(time * 1.7) * 0.08);
    });

    // head: follows the finger, opens its mouth for food, chews, shakes
    var hp = P.eye();
    var looking = now < act.lookUntil && !ride && !sleeping;
    var pitch = looking ? Math.max(-0.4, Math.min(0.4, (hp[1] - act.py) / 320)) : Math.sin(time * 1.2) * 0.04;
    var yaw = looking ? -Math.max(0.15, Math.min(0.75, 0.3 + (hp[0] - act.px) / 380)) : 0;
    if (act.wants) pitch -= 0.12;
    if (act.munch > 0) {
      act.munch = Math.max(0, act.munch - dt);
      pitch = -0.15 + Math.sin(time * 22) * 0.1;
    }
    var shake = act.idle === "shake" && !sleeping ? Math.sin(act.idleT * 16) * 0.22 : 0;
    if (sleeping) pitch = -0.55 + Math.sin(time * 1.1) * 0.03;      // head down, breathing slowly
    if (tp.pitch !== null) pitch = tp.pitch;
    U.head.rotation.z = ease(U.head.rotation.z, pitch, dt * 9);
    U.head.rotation.y = ease(U.head.rotation.y, yaw + shake, dt * 9);
    var open = act.munch > 0 ? 0.6 + Math.sin(time * 22) * 0.5 : (act.wants ? 1.25 : 0);
    U.mouth.scale.y = ease(U.mouth.scale.y, 0.085 * (0.45 + open), dt * 16);
    U.mouth.scale.x = ease(U.mouth.scale.x, 0.085 * (0.9 + open * 0.25), dt * 16);

    // eyes: blink, and squint with joy when stroked or all is well
    act.nextBlink -= dt;
    if (act.nextBlink <= 0) { act.blink = 0.14; act.nextBlink = 2.5 + Math.random() * 3; }
    if (act.blink > 0) act.blink -= dt;
    if (act.petting > 0) act.petting -= dt;
    var lid = sleeping || act.blink > 0 ? 0.08 : (act.petting > 0 ? 0.22 : (happy ? 0.62 : 1));
    U.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, lid, dt * 22); });
    U.ears.forEach(function(e, i){
      var tw = act.idle === "ear" ? Math.sin(act.idleT * 18) * 0.35 : 0;
      e.rotation.z = ease(e.rotation.z, tw, dt * 16);
    });
    if (act.idle) { act.idleT += dt; if (act.idleT > 1.05) act.idle = ""; }

    // foam fades
    for (var i = foam.length - 1; i >= 0; i--) {
      var f = foam[i];
      f.userData.life -= dt;
      var s = f.userData.size * Math.min(1, f.userData.life / 0.8);
      f.scale.setScalar(Math.max(0.001, s));
      if (f.userData.life <= 0) { uni.remove(f); foam.splice(i, 1); }
    }

    // the cat
    var hop = 0;
    if (act.catHop > 0) {
      act.catHop = Math.max(0, act.catHop - dt);
      var cj = 1 - act.catHop / 0.7;
      hop = Math.abs(Math.sin(cj * Math.PI * 2)) * 0.4 * (1 - cj * 0.6);
    }
    var running = (yarn && (yarn.phase === "run" || yarn.phase === "home" || yarn.phase === "drop")) || ride;
    if (ride) {
      cat.position.x = ease(cat.position.x, 2.6, k); cat.position.z = ease(cat.position.z, 1.2, k);
      cat.rotation.y = ease(cat.rotation.y, -0.3, k);
    } else if (!yarn && !seek.phase) {
      cat.position.x = ease(cat.position.x, CAT_HOME.x, k); cat.position.z = ease(cat.position.z, CAT_HOME.z, k);
      cat.rotation.y = ease(cat.rotation.y, CAT_ROT, k);
    }
    cat.scale.setScalar(ease(cat.scale.x, ride ? 0.62 : 1.12, k));     // small beside the small riding unicorn
    // in the barn the cat sits in its basket
    var atHome = !yarn && !ride && Math.abs(cat.position.x - CAT_HOME.x) < 0.3;
    var basket = place === "stall" && atHome ? 0.34 : 0;
    // hide and seek ducks the cat down; the magic horn can make it float
    var catFloat = act.catFloat > 0 ? Math.sin(Math.PI * (1 - act.catFloat / 3)) * 2.2 : 0;
    cat.rotation.z = act.catFloat > 0 ? Math.sin(time * 5) * 0.3 : 0;
    cat.position.y = hop + basket + (act.catSink || 0) + catFloat + (running || seek.phase === "go" || seek.phase === "back" ? Math.abs(Math.sin(time * 14)) * 0.14 : 0) + (ride && ride.mode !== "jump" ? ride.y * 0.35 : 0);
    C.body.rotation.z = running ? Math.sin(time * 14) * 0.08 : 0;
    C.head.rotation.x = Math.sin(time * 1.7) * 0.07;
    // eating: the head dips to the bowl and bobs
    if (act.catMunch > 0) act.catMunch -= dt;
    C.head.rotation.z = ease(C.head.rotation.z, act.catMunch > 0 ? -0.35 + Math.sin(time * 20) * 0.12 : (sleeping ? -0.3 : 0), dt * 12);
    if (act.catPurr > 0) act.catPurr -= dt;
    var clid = sleeping ? 0.1 : (act.catPurr > 0 ? 0.2 : (act.blink > 0 ? 0.1 : 1));
    C.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, clid, dt * 22); });

    stepExtras(dt, k);
    stepMore(dt, k);
    renderer.render(scene, camera);
  }

  // little things the unicorn does on its own
  function idle(){
    if (ride || drag || reduced || act.idle || asleep()) return;
    act.idle = ["ear", "paw", "shake", "ear"][Math.floor(Math.random() * 4)];
    act.idleT = 0;
  }

  function start(hot){
    state = load(hot);
    fit();
    setPlace(cur().asleep ? "stall" : "eng");

    save();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

    NEEDS.forEach(function(k){

        // a tap only shows how: the child has to do it with a finger. (Keyboard still works.)
        if (asleep()) showHint("moon", btn, P.head());

      });
    });

    // the big button: a ride in the meadow, jump training on the course, good night in the barn
    $("ride").addEventListener("click", function(){

      else if (place === "eng" && cur().saddle && !asleep()) openRides();   // the meadow has six rides to pick from

    // the animal picker: the Dyr button shows the other animals; a tap on a picture goes there
    $("p-farm").addEventListener("click", function(){
      if (ride) return;

    });

    $("farm").addEventListener("click", function(e){ if (e.target === $("farm")) $("farm").hidden = true; });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("farm").hidden) { $("farm").hidden = true; $("p-farm").focus(); } });
    // the ride picker: one tap on a picture starts that ride
    function openRides(){ $("rides").hidden = false; tone([523, 659]); $("ride-fly").focus(); }
    function closeRides(){ $("rides").hidden = true; }
    Object.keys(RIDE_KINDS).forEach(function(k){
      $("ride-" + k).addEventListener("click", function(){ closeRides(); startRide(k); });
    });
    $("rides").addEventListener("click", function(e){ if (e.target === $("rides")) closeRides(); });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("rides").hidden) { closeRides(); $("ride").focus(); } });

    // moving between the meadow, the barn, the training ground and the rabbit garden
    ["eng", "stall", "bane", "kanin", "gris"].forEach(function(k){
      $("p-" + k).addEventListener("click", function(){
        if (ride || k === place) return;
        if (asleep()) { showHint("moon", $("p-" + k), P.head()); return; }
        if (yarn) { yarnBall.scale.setScalar(1); clearYarn(); }
        setPlace(k);
        renderLook(); renderMood();
        react("joy");
        tone([523, 784]);
      });
    });

    // the saddle is dragged from its button onto the unicorn's back; a tap on the button takes it off again
    var sb = $("saddle-btn"), sd = null;
    function saddleOn(on){
      cur().saddle = on;
      save(); renderLook();
      tone(on ? [523, 659, 784] : [659, 523]);
      if (on) { burst("star", P.back(), 6); react("joy"); award("saddle"); }
    }
    sb.addEventListener("pointerdown", function(e){
      if (ride || asleep() || cur().saddle) return;
      sd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
      try { sb.setPointerCapture(e.pointerId); } catch(err){}
    });
    sb.addEventListener("pointermove", function(e){
      if (!sd || e.pointerId !== sd.id) return;
      if (!sd.el) {
        if (Math.hypot(e.clientX - sd.x0, e.clientY - sd.y0) < 10) return;
        sd.el = icon("saddle", 64);
        fx.appendChild(sd.el);
      }
      sd.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
      lookAt(e.clientX, e.clientY);
    });
    function saddleDrop(e){
      if (!sd || e.pointerId !== sd.id) return;
      var d = sd; sd = null;
      try { sb.releasePointerCapture(d.id); } catch(err){}
      if (!d.el) return;
      d.el.remove();
      lastDragEnd = Date.now();
      if (e.type !== "pointercancel" && hitUnicorn(e.clientX, e.clientY)) saddleOn(true);
    }
    sb.addEventListener("pointerup", saddleDrop);
    sb.addEventListener("pointercancel", saddleDrop);
    sb.addEventListener("click", function(e){
      if (Date.now() - lastDragEnd < 400 || ride) return;
      if (asleep()) { showHint("moon", sb, P.head()); return; }
      if (cur().saddle) saddleOn(false);
      else if (e.detail === 0) saddleOn(true);
      else showHint("saddle", sb, P.back());
    });

    // the yarn ball is dragged out of its button and dropped on the grass
    var yb = $("yarn-btn"), yd = null;
    yb.addEventListener("pointerdown", function(e){
      if (ride) return;
      yd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
      try { yb.setPointerCapture(e.pointerId); } catch(err){}
    });
    yb.addEventListener("pointermove", function(e){
      if (!yd || e.pointerId !== yd.id) return;
      if (!yd.el) {
        if (Math.hypot(e.clientX - yd.x0, e.clientY - yd.y0) < 10) return;
        yd.el = icon("yarn", 56);
        fx.appendChild(yd.el);
      }
      yd.el.style.transform = tr([e.clientX, e.clientY], 56, 1);
    });
    function yarnDrop(e){
      if (!yd || e.pointerId !== yd.id) return;
      var d = yd; yd = null;
      try { yb.releasePointerCapture(d.id); } catch(err){}
      if (!d.el) return;
      d.el.remove();
      lastDragEnd = Date.now();
      var sr = stage.getBoundingClientRect();
      if (e.type !== "pointercancel" && e.clientX > sr.left && e.clientX < sr.right && e.clientY > sr.top && e.clientY < sr.bottom) {
        throwYarn(e.clientX, e.clientY);
      }
    }
    yb.addEventListener("pointerup", yarnDrop);
    yb.addEventListener("pointercancel", yarnDrop);
    yb.addEventListener("click", function(e){
      if (Date.now() - lastDragEnd < 400) return;
      var sr = stage.getBoundingClientRect();
      var to = [sr.left + sr.width * 0.55, sr.bottom - sr.height * 0.1];
      if (e.detail === 0) throwYarn(to[0], to[1]);
      else showHint("yarn", yb, to);

    // a round button whose thing is dragged out and dropped somewhere in the picture
    function dragOut(btn, iconName, canStart, onDrop, onTap){
      var st = null;
      btn.addEventListener("pointerdown", function(e){
        if (ride || asleep() || !canStart()) return;
        st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
      });
      btn.addEventListener("pointermove", function(e){
        if (!st || e.pointerId !== st.id) return;
        if (!st.el) {
          if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 10) return;
          st.el = icon(iconName, 60);
          fx.appendChild(st.el);
        }
        st.el.style.transform = tr([e.clientX, e.clientY], 60, 1);
      });
      function end(e){
        if (!st || e.pointerId !== st.id) return;
        var d = st; st = null;
        try { btn.releasePointerCapture(d.id); } catch(err){}
        if (!d.el) return;
        d.el.remove();
        lastDragEnd = Date.now();
        if (e.type !== "pointercancel") onDrop(e.clientX, e.clientY);
      }
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointercancel", end);
      btn.addEventListener("click", function(e){
        if (Date.now() - lastDragEnd < 400 || ride) return;
        if (asleep()) { showHint("moon", btn, P.head()); return; }
        onTap(e.detail === 0);
      });
    }
    // the baby's bottle
    dragOut($("bottle-btn"), "bottle", function(){ return state.baby; },
      function(x, y){ if (nearFoal(x, y)) feedFoal(); },
      function(keyboard){
        if (keyboard) feedFoal();
        else showHint("bottle", $("bottle-btn"), screenOf(local(F.head, 0.4, 0.2, 0)));
      });
    // a fence for the child's own course
    dragOut($("fence-btn"), "jump", function(){ return place === "bane"; },
      function(x, y){ var g = groundAt(x, y); if (g) addFence(g.x, g.z); },
      function(keyboard){
        if (keyboard) addFence(-3 + (cur().course || []).length * 1.4, 1.9);
        else { var sr = stage.getBoundingClientRect(); showHint("jump", $("fence-btn"), [sr.left + sr.width * 0.5, sr.top + sr.height * 0.7]); }
      });

    dragOut($("shoe-btn"), "shoe", function(){ return place === "stall"; },
      function(x, y){
        if (shoesOn()) { say("Skoene er fine!", "shoe"); return; }
        var i = hoofAt(x, y);
        if (i >= 0) shoeOn(i); else tone([330]);
      },
      function(keyboard){
        if (shoesOn()) { say("Skoene er fine!", "shoe"); return; }

      });
    // tricks in the meadow, the show on the training ground

      if (asleep()) { showHint("moon", $("trick-btn"), P.head()); return; }

    });
    $("show-btn").addEventListener("click", function(){
      if (ride) return;
      startShow();
    });
    $("rain-cloud").addEventListener("click", function(){ startRain(); });   // tap the cloud and it rains
    // the small cloud turns winter on and off
    $("snow-cloud").addEventListener("click", function(){

      setWinter(!state.winter);
    });
    // the bath tub in the barn: a tap brings it out, another tap ends the bath
    $("bath-btn").addEventListener("click", function(){
      if (ride) return;
      if (asleep()) { showHint("moon", $("bath-btn"), P.head()); return; }
      if (bath.on) endBath(true); else startBath();
    });
    // painting: a sheet of paper, eight colours and a finger
    (function(){
      var c = $("paper"), box = $("inks"), last = null;
      ["#ff5a6e", "#ffa63c", "#ffe04a", "#5cd07a", "#4db8ff", "#a66bff", "#ff8fc7", "#2b2350"].forEach(function(col, i){

      wipe.addEventListener("click", function(){
        if (!paper) return;

        tone([523, 392]);
      });
      box.appendChild(wipe);
      function at(e){
        var r = c.getBoundingClientRect();
        return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height];
      }
      c.addEventListener("pointerdown", function(e){
        if (!paper) return;
        try { c.setPointerCapture(e.pointerId); } catch(err){}
        last = at(e);

        if (!last || !paper) return;
