  }
  function closeEasel(keep){
    $("easel").hidden = true;
    if (!keep || !painted) return;
    var small = document.createElement("canvas");
    small.width = 240; small.height = 180;
    small.getContext("2d").drawImage($("paper"), 0, 0, 240, 180);
    try { state.art = small.toDataURL("image/jpeg", 0.75); } catch(e){ return; }
    save();
    showArt(state.art);
    toast("Bildet henger i stallen!", "palette");
    addStars(2); renderMood();
    award("paint");
  }

  function stepMore(dt, k){
    var u = cur(), now = performance.now();
    // bath: the water level, and the bath ends by itself if the unicorn leaves the barn
    if (bath.on && (place !== "stall" || asleep() || ride)) endBath(false);
    U.tubWater.visible = bath.water > 0;
    U.tubWater.position.y = 0.25 + 0.8 * bath.water / 100;

    // picnic: folds itself away a moment after everything is eaten
    if (picnic.cool > 0) picnic.cool -= dt;
    if (picnic.close > 0) {
      picnic.close -= dt;
      if (picnic.close <= 0) { picnic.open = false; picnic.cool = 60; }
    }
    blanket.visible = picnic.open && !ride;
    mound.visible = dig.on && !ride;
    U.rug.visible = !!state.winter && place === "eng" && !u.saddle && !ride;

    // treasure: a new sparkling spot now and then
    if (!dig.on && place === "eng" && !ride && !u.asleep) {
      dig.next -= dt;
      if (dig.next <= 0) {
        var sp = DIG_SPOTS[dig.spot++ % DIG_SPOTS.length];
        mound.position.set(sp[0], 0, sp[1]);
        mound.scale.setScalar(1);
        mound.visible = true;
        dig.on = true; dig.prog = 0;
      }
    }
    if (dig.on) {
      var ms = 1 - dig.prog / 9;
      mound.scale.set(ms, ms, ms);
      var sk = mound.userData.spark;
      sk.rotation.y = time * 2;
      sk.scale.setScalar(0.4 + 0.15 * Math.abs(Math.sin(time * 4)));
    }

    stepSeek(dt);
    stepToy(dt);

    // magic horn: it glows more the longer the finger stays
    if (magic.hold) {
      var g = Math.min(1, (now - magic.t0) / 800);
      hornGlow(g * (0.7 + 0.3 * Math.sin(time * 20)));
      if (g >= 1 && !magic.ready) { magic.ready = true; tone([1319, 1568]); burst("star", P.head(), 4); }
    }
    if (act.bloom > 0) act.bloom -= dt;
    var fl = act.bloom > 0 ? 1 + Math.min(1, act.bloom) * 2.2 : 1;
    flowers.forEach(function(f){ f.scale.set(0.09 * fl, 0.054 * fl, 0.09 * fl); f.position.y = 0.06 * fl; });
    if (act.catFloat > 0) act.catFloat -= dt;

    // parade: everyone bobs in step, with stars in the air
    if (parade.t > 0) {
      parade.t -= dt;
      parade.beat -= dt;
      if (parade.beat <= 0) {
        parade.beat = 0.5;
        act.catHop = 0.45; act.foalHop = 0.45;
        burst("star", [P.body()[0] + (Math.random() - 0.5) * 300, P.head()[1]], 2);
        burst("note", P.cat(), 1);
        burst("heart", screenOf(tmp2.copy(friendModels.bunny.position).setY(1.2)), 1);
      }
      var bob = Math.abs(Math.sin(time * 8));
      uni.position.y += bob * 0.12;
      ["duck", "bunny"].forEach(function(n, i){ friendModels[n].position.y = Math.abs(Math.sin(time * 8 + i)) * 0.25; });
      if (parade.t <= 0) {
        ["duck", "bunny"].forEach(function(n){ friendModels[n].visible = false; friendModels[n].rotation.y = -0.5; });
        addStars(3); save(); renderMood();
      }
    }
  }

  // --- the 3D loop: everything that moves ------------------------------------
  var clock = new T.Clock(), time = 0;
  function ease(a, b, k){ return a + (b - a) * Math.min(1, k); }
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    time += dt;
    var now = performance.now();
    var u = cur();
    var happy = game.classList.contains("happy");

    if (ride) stepRide(dt);
    stepYarn(dt);

    // where the unicorn stands, how big it is, which way it faces
    var k = dt * 6;
    var sc = ease(uni.scale.x, ride ? RIDE_SCALE : 1, k);
    uni.scale.setScalar(sc);
    uni.position.x = ease(uni.position.x, ride ? RIDE_X : HOME_X, k);
    if (ride) uni.rotation.y = ease(uni.rotation.y, 0, k);
    var jump = 0;
    if (act.joy > 0) {
      act.joy = Math.max(0, act.joy - dt);
      var j = 1 - act.joy / 0.8;
      jump = Math.abs(Math.sin(j * Math.PI * 2)) * 0.55 * (1 - j * 0.6);
    }
    var gallop = ride ? Math.abs(Math.sin(time * 13)) * 0.12 : 0;
    // asleep: it lies down with its legs stretched out
    var sleeping = !!u.asleep && !ride;
    act.lie = ease(act.lie, sleeping ? 1 : 0, dt * 3);
    uni.position.y = (ride ? ride.y : 0) + jump + gallop - 1.2 * act.lie;
    uni.rotation.z = ride ? Math.sin(time * 13) * 0.05 : 0;
    if (sleeping) {
      act.zzz -= dt;
      if (act.zzz <= 0) { act.zzz = 1.7; zzz(); }
    }

    // breathing, tail, legs
    var wag = ride ? 9 : 2.2;
    U.tail.rotation.z = Math.sin(time * wag) * (ride ? 0.3 : 0.12) + (ride ? 0.5 : 0);
    U.tail.rotation.y = Math.sin(time * 1.6) * 0.25;
    if (ride && ride.mode === "jump" && ride.y > 0) {
      // in the air over a fence: front legs tucked forward, hind legs stretched back
      U.legs.forEach(function(l, i){ l.rotation.z = ease(l.rotation.z, i < 2 ? 0.95 : -0.95, dt * 14); });
    } else if (ride) {
      U.legs.forEach(function(l, i){ l.rotation.z = Math.sin(time * 13 + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.7; });
    } else {
      U.legs.forEach(function(l, i){
        var paw = act.idle === "paw" && i === 0 && !sleeping ? Math.max(0, Math.sin(act.idleT * 12)) * 0.7 : 0;
        var rest = (i < 2 ? 1.35 : -1.35) * act.lie;
        l.rotation.z = ease(l.rotation.z, paw + rest, dt * 14);
      });
    }
    U.wings.forEach(function(w, i){
      var sg = i ? -1 : 1;
      w.rotation.x = sg * (ride ? 0.2 + Math.sin(time * 15) * 0.55 : 0.1 + Math.sin(time * 1.7) * 0.08);
    });

    // head: follows the finger, opens its mouth for food, chews, shakes
    var hp = P.eye();
    var looking = now < act.lookUntil && !ride && !sleeping;
    var pitch = looking ? Math.max(-0.4, Math.min(0.4, (hp[1] - act.py) / 320)) : Math.sin(time * 1.2) * 0.04;
    var yaw = looking ? -Math.max(0.15, Math.min(0.75, 0.3 + (hp[0] - act.px) / 380)) : 0;
    if (act.wants) pitch -= 0.12;
    if (act.munch > 0) {
      act.munch = Math.max(0, act.munch - dt);
      pitch = -0.15 + Math.sin(time * 22) * 0.1;
    }
    var shake = act.idle === "shake" && !sleeping ? Math.sin(act.idleT * 16) * 0.22 : 0;
    if (sleeping) pitch = -0.55 + Math.sin(time * 1.1) * 0.03;      // head down, breathing slowly
    U.head.rotation.z = ease(U.head.rotation.z, pitch, dt * 9);
    U.head.rotation.y = ease(U.head.rotation.y, yaw + shake, dt * 9);
    var open = act.munch > 0 ? 0.6 + Math.sin(time * 22) * 0.5 : (act.wants ? 1.25 : 0);
    U.mouth.scale.y = ease(U.mouth.scale.y, 0.085 * (0.45 + open), dt * 16);
    U.mouth.scale.x = ease(U.mouth.scale.x, 0.085 * (0.9 + open * 0.25), dt * 16);

    // eyes: blink, and squint with joy when stroked or all is well
    act.nextBlink -= dt;
    if (act.nextBlink <= 0) { act.blink = 0.14; act.nextBlink = 2.5 + Math.random() * 3; }
    if (act.blink > 0) act.blink -= dt;
    if (act.petting > 0) act.petting -= dt;
    var lid = sleeping || act.blink > 0 ? 0.08 : (act.petting > 0 ? 0.22 : (happy ? 0.62 : 1));
    U.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, lid, dt * 22); });
    U.ears.forEach(function(e, i){
      var tw = act.idle === "ear" ? Math.sin(act.idleT * 18) * 0.35 : 0;
      e.rotation.z = ease(e.rotation.z, tw, dt * 16);
    });
    if (act.idle) { act.idleT += dt; if (act.idleT > 1.05) act.idle = ""; }

    // foam fades
    for (var i = foam.length - 1; i >= 0; i--) {
      var f = foam[i];
      f.userData.life -= dt;
      var s = f.userData.size * Math.min(1, f.userData.life / 0.8);
      f.scale.setScalar(Math.max(0.001, s));
      if (f.userData.life <= 0) { uni.remove(f); foam.splice(i, 1); }
    }

    // the cat
    var hop = 0;
    if (act.catHop > 0) {
      act.catHop = Math.max(0, act.catHop - dt);
      var cj = 1 - act.catHop / 0.7;
      hop = Math.abs(Math.sin(cj * Math.PI * 2)) * 0.4 * (1 - cj * 0.6);
    }
    var running = (yarn && (yarn.phase === "run" || yarn.phase === "home" || yarn.phase === "drop")) || ride;
    if (ride) {
      cat.position.x = ease(cat.position.x, 2.6, k); cat.position.z = ease(cat.position.z, 1.2, k);
      cat.rotation.y = ease(cat.rotation.y, -0.3, k);
    } else if (!yarn && !seek.phase) {
      cat.position.x = ease(cat.position.x, CAT_HOME.x, k); cat.position.z = ease(cat.position.z, CAT_HOME.z, k);
      cat.rotation.y = ease(cat.rotation.y, CAT_ROT, k);
    }
    cat.scale.setScalar(ease(cat.scale.x, ride ? 0.62 : 1.12, k));     // small beside the small riding unicorn
    // in the barn the cat sits in its basket
    var atHome = !yarn && !ride && Math.abs(cat.position.x - CAT_HOME.x) < 0.3;
    var basket = place === "stall" && atHome ? 0.34 : 0;
    // hide and seek ducks the cat down; the magic horn can make it float
    var catFloat = act.catFloat > 0 ? Math.sin(Math.PI * (1 - act.catFloat / 3)) * 2.2 : 0;
    cat.rotation.z = act.catFloat > 0 ? Math.sin(time * 5) * 0.3 : 0;
    cat.position.y = hop + basket + (act.catSink || 0) + catFloat + (running || seek.phase === "go" || seek.phase === "back" ? Math.abs(Math.sin(time * 14)) * 0.14 : 0) + (ride && ride.mode !== "jump" ? ride.y * 0.35 : 0);
    C.body.rotation.z = running ? Math.sin(time * 14) * 0.08 : 0;
    C.head.rotation.x = Math.sin(time * 1.7) * 0.07;
    // eating: the head dips to the bowl and bobs
    if (act.catMunch > 0) act.catMunch -= dt;
    C.head.rotation.z = ease(C.head.rotation.z, act.catMunch > 0 ? -0.35 + Math.sin(time * 20) * 0.12 : (sleeping ? -0.3 : 0), dt * 12);
    if (act.catPurr > 0) act.catPurr -= dt;
    var clid = sleeping ? 0.1 : (act.catPurr > 0 ? 0.2 : (act.blink > 0 ? 0.1 : 1));
    C.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, clid, dt * 22); });

    stepExtras(dt, k);
    stepMore(dt, k);
    renderer.render(scene, camera);
  }

  // little things the unicorn does on its own
  function idle(){
    if (ride || drag || reduced || act.idle || asleep()) return;
    act.idle = ["ear", "paw", "shake", "ear"][Math.floor(Math.random() * 4)];
    act.idleT = 0;
  }

  function start(hot){
    state = load(hot);
    fit();
    setPlace(cur().asleep ? "stall" : "eng");
    render();
    save();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    window.addEventListener("resize", fit);

    NEEDS.forEach(function(k){
      var btn = $("b-" + k);
      btn.addEventListener("pointerdown", function(e){ dragStart(k, btn, e); });
      btn.addEventListener("pointermove", dragMove);
      btn.addEventListener("pointerup", dragEnd);
      btn.addEventListener("pointercancel", dragEnd);
      btn.addEventListener("click", function(e){
        if (Date.now() - lastDragEnd < 400) return;
        // a tap only shows how: the child has to do it with a finger. (Keyboard still works.)
        if (asleep()) showHint("moon", btn, P.head());
        else if (e.detail === 0) care(k);
        else showHint(k);
      });
    });

    // the big button: a ride in the meadow, jump training on the course, good night in the barn
    $("ride").addEventListener("click", function(){
      if (ride) stopRide();
      else if (place === "stall") { if (asleep()) goodMorning(); else goodNight(); }
      else startRide();
    });

    // moving between the meadow, the barn and the training ground
    ["eng", "stall", "bane"].forEach(function(k){
      $("p-" + k).addEventListener("click", function(){
        if (ride || k === place) return;
        if (asleep()) { showHint("moon", $("p-" + k), P.head()); return; }
        if (yarn) { yarnBall.scale.setScalar(1); clearYarn(); }
        setPlace(k);
        renderLook(); renderMood();
        react("joy");
        tone([523, 784]);
      });
    });

    // the saddle is dragged from its button onto the unicorn's back; a tap on the button takes it off again
    var sb = $("saddle-btn"), sd = null;
    function saddleOn(on){
      cur().saddle = on;
      save(); renderLook();
      tone(on ? [523, 659, 784] : [659, 523]);
      if (on) { burst("star", P.back(), 6); react("joy"); award("saddle"); }
    }
    sb.addEventListener("pointerdown", function(e){
      if (ride || asleep() || cur().saddle) return;
      sd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
      try { sb.setPointerCapture(e.pointerId); } catch(err){}
    });
    sb.addEventListener("pointermove", function(e){
      if (!sd || e.pointerId !== sd.id) return;
      if (!sd.el) {
        if (Math.hypot(e.clientX - sd.x0, e.clientY - sd.y0) < 10) return;
        sd.el = icon("saddle", 64);
        fx.appendChild(sd.el);
      }
      sd.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
      lookAt(e.clientX, e.clientY);
    });
    function saddleDrop(e){
      if (!sd || e.pointerId !== sd.id) return;
      var d = sd; sd = null;
      try { sb.releasePointerCapture(d.id); } catch(err){}
      if (!d.el) return;
      d.el.remove();
      lastDragEnd = Date.now();
      if (e.type !== "pointercancel" && hitUnicorn(e.clientX, e.clientY)) saddleOn(true);
    }
    sb.addEventListener("pointerup", saddleDrop);
    sb.addEventListener("pointercancel", saddleDrop);
    sb.addEventListener("click", function(e){
      if (Date.now() - lastDragEnd < 400 || ride) return;
      if (asleep()) { showHint("moon", sb, P.head()); return; }
      if (cur().saddle) saddleOn(false);
      else if (e.detail === 0) saddleOn(true);
      else showHint("saddle", sb, P.back());
    });

    // the yarn ball is dragged out of its button and dropped on the grass
    var yb = $("yarn-btn"), yd = null;
    yb.addEventListener("pointerdown", function(e){
      if (ride) return;
      yd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
      try { yb.setPointerCapture(e.pointerId); } catch(err){}
    });
    yb.addEventListener("pointermove", function(e){
      if (!yd || e.pointerId !== yd.id) return;
      if (!yd.el) {
        if (Math.hypot(e.clientX - yd.x0, e.clientY - yd.y0) < 10) return;
        yd.el = icon("yarn", 56);
        fx.appendChild(yd.el);
      }
      yd.el.style.transform = tr([e.clientX, e.clientY], 56, 1);
    });
    function yarnDrop(e){
      if (!yd || e.pointerId !== yd.id) return;
      var d = yd; yd = null;
      try { yb.releasePointerCapture(d.id); } catch(err){}
      if (!d.el) return;
      d.el.remove();
      lastDragEnd = Date.now();
      var sr = stage.getBoundingClientRect();
      if (e.type !== "pointercancel" && e.clientX > sr.left && e.clientX < sr.right && e.clientY > sr.top && e.clientY < sr.bottom) {
        throwYarn(e.clientX, e.clientY);
      }
    }
    yb.addEventListener("pointerup", yarnDrop);
    yb.addEventListener("pointercancel", yarnDrop);
    yb.addEventListener("click", function(e){
      if (Date.now() - lastDragEnd < 400) return;
      var sr = stage.getBoundingClientRect();
      var to = [sr.left + sr.width * 0.55, sr.bottom - sr.height * 0.1];
      if (e.detail === 0) throwYarn(to[0], to[1]);
      else showHint("yarn", yb, to);
    });

    // a round button whose thing is dragged out and dropped somewhere in the picture
    function dragOut(btn, iconName, canStart, onDrop, onTap){
      var st = null;
      btn.addEventListener("pointerdown", function(e){
        if (ride || asleep() || !canStart()) return;
        st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
      });
      btn.addEventListener("pointermove", function(e){
        if (!st || e.pointerId !== st.id) return;
        if (!st.el) {
          if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 10) return;
          st.el = icon(iconName, 60);
          fx.appendChild(st.el);
        }
        st.el.style.transform = tr([e.clientX, e.clientY], 60, 1);
      });
      function end(e){
        if (!st || e.pointerId !== st.id) return;
        var d = st; st = null;
        try { btn.releasePointerCapture(d.id); } catch(err){}
        if (!d.el) return;
        d.el.remove();
        lastDragEnd = Date.now();
        if (e.type !== "pointercancel") onDrop(e.clientX, e.clientY);
      }
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointercancel", end);
      btn.addEventListener("click", function(e){
        if (Date.now() - lastDragEnd < 400 || ride) return;
        if (asleep()) { showHint("moon", btn, P.head()); return; }
        onTap(e.detail === 0);
      });
    }
    // the baby's bottle
    dragOut($("bottle-btn"), "bottle", function(){ return state.baby; },
      function(x, y){ if (nearFoal(x, y)) feedFoal(); },
      function(keyboard){
        if (keyboard) feedFoal();
        else showHint("bottle", $("bottle-btn"), screenOf(local(F.head, 0.4, 0.2, 0)));
      });
    // a fence for the child's own course
    dragOut($("fence-btn"), "jump", function(){ return place === "bane"; },
      function(x, y){ var g = groundAt(x, y); if (g) addFence(g.x, g.z); },
      function(keyboard){
        if (keyboard) addFence(-3 + (cur().course || []).length * 1.4, 1.9);
        else { var sr = stage.getBoundingClientRect(); showHint("jump", $("fence-btn"), [sr.left + sr.width * 0.5, sr.top + sr.height * 0.7]); }
      });
    $("rain-cloud").addEventListener("click", function(){ startRain(); });   // tap the cloud and it rains
    // the small cloud turns winter on and off
    $("snow-cloud").addEventListener("click", function(){
      if (ride || place !== "eng" || asleep()) return;
      setWinter(!state.winter);
    });
    // the bath tub in the barn: a tap brings it out, another tap ends the bath
    $("bath-btn").addEventListener("click", function(){
      if (ride) return;
      if (asleep()) { showHint("moon", $("bath-btn"), P.head()); return; }
      if (bath.on) endBath(true); else startBath();
    });
    // painting: a sheet of paper, eight colours and a finger
    (function(){
      var c = $("paper"), box = $("inks"), last = null;
      ["#ff5a6e", "#ffa63c", "#ffe04a", "#5cd07a", "#4db8ff", "#a66bff", "#ff8fc7", "#2b2350"].forEach(function(col, i){
        var b = document.createElement("button");
        b.type = "button"; b.className = "ink"; b.id = "ink-" + i;
        b.style.background = col;
        b.setAttribute("aria-label", "Farge " + (i + 1));
        b.setAttribute("aria-pressed", col === ink ? "true" : "false");
        b.addEventListener("click", function(){
          ink = col;
          box.querySelectorAll(".ink").forEach(function(o){ o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
          tone([660]);
        });
        box.appendChild(b);
      });
      var wipe = document.createElement("button");
      wipe.type = "button"; wipe.className = "ink wipe"; wipe.id = "ink-wipe";
      wipe.setAttribute("aria-label", "Visk ut");
      wipe.appendChild(icon("eraser", 28));
      wipe.addEventListener("click", function(){
        if (!paper) return;
        paper.fillStyle = "#ffffff"; paper.fillRect(0, 0, c.width, c.height);
        painted = true;
        tone([523, 392]);
      });
      box.appendChild(wipe);
      function at(e){
        var r = c.getBoundingClientRect();
        return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height];
      }
      c.addEventListener("pointerdown", function(e){
        if (!paper) return;
        try { c.setPointerCapture(e.pointerId); } catch(err){}
        last = at(e);
        paper.fillStyle = ink;
        paper.beginPath(); paper.arc(last[0], last[1], 8, 0, Math.PI * 2); paper.fill();   // a dot for a tap
        painted = true;
      });
      c.addEventListener("pointermove", function(e){
        if (!last || !paper) return;
        var p = at(e);
        paper.strokeStyle = ink;
        paper.beginPath(); paper.moveTo(last[0], last[1]); paper.lineTo(p[0], p[1]); paper.stroke();
        last = p;
      });
      function up(){ last = null; }
      c.addEventListener("pointerup", up);
      c.addEventListener("pointercancel", up);
      $("paint-btn").addEventListener("click", function(){ openEasel(); $("easel-done").focus(); });
      $("easel-done").addEventListener("click", function(){ closeEasel(true); $("paint-btn").focus(); });
      $("easel").addEventListener("click", function(e){ if (e.target === $("easel")) closeEasel(true); });
      document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("easel").hidden) closeEasel(true); });
    })();
    showArt(state.art);              // the picture from last time hangs in the barn
    // the sticker book
    $("book-btn").addEventListener("click", function(){ renderBook(); $("book").hidden = false; $("book-close").focus(); });
    $("book-close").addEventListener("click", function(){ $("book").hidden = true; $("book-btn").focus(); });
    $("book").addEventListener("click", function(e){ if (e.target === $("book")) $("book").hidden = true; });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape") $("book").hidden = true; });
    $("book-count").textContent = stickerCount();
    if (!state.baby && state.stars >= BABY_AT) babyArrives();

    // fingers on the 3D picture: stroke the animals, turn the unicorn, throw yarn, steer the ride
    var touch = null;
    canvas.addEventListener("pointerdown", function(e){
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      lookAt(e.clientX, e.clientY);
      if (ride) {
        touch = { id: e.pointerId, mode: "steer" };
        if (ride.mode === "jump") hop(); else steer(e.clientX, e.clientY);
        return;
      }
      // in the barn, a dirty straw pile can be picked up and carried to the wheelbarrow
      if (place === "stall" && !asleep()) {
        aim(e.clientX, e.clientY);
        var ph = ray.intersectObjects(barn.piles.filter(function(p){ return p.visible; }), false);
        if (ph.length) {
          touch = { id: e.pointerId, mode: "pile", pile: ph[0].object, x0: e.clientX, y0: e.clientY, moved: true, n: 1 };
          return;
        }
      }
      var px = e.clientX, py = e.clientY;
      if (!asleep()) {
        // hide and seek: there is the cat!
        if (nearHiddenCat(px, py)) {
          catFound();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // the magic horn: hold a finger on it until it glows
        if (onHorn(px, py)) {
          magic.hold = true; magic.t0 = performance.now(); magic.ready = false;
          touch = { id: e.pointerId, mode: "horn" };
          return;
        }
      }
      if (place === "eng" && !asleep()) {
        // the baby's ball: a tap throws it
        if (ballAt(px, py)) {
          throwBall();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // picnic: food from the blanket is carried to whoever likes it
        var pf = foodAt(px, py);
        if (pf) {
          pf.group.visible = false;
          var fel = icon(pf.kind === "cookie" ? "fish" : pf.kind, 64);
          fx.appendChild(fel);
          fel.style.transform = tr([px, py], 64, 1);
          touch = { id: e.pointerId, mode: "food", food: pf, el: fel };
          return;
        }
        if (hitAny(basketMeshes, px, py) && !hitUnicorn(px, py)) {
          if (picnic.open) say("Gi alle noe godt!", "cake");
          else if (picnic.cool > 0) { say("Kurven er tom. Vent litt!", "cake"); tone([330, 262]); }
          else openPicnic();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // treasure: dig where it sparkles, by rubbing or tapping
        if (digAt(groundAt(px, py)) && !hitUnicorn(px, py)) {
          digStep(px, py);
          touch = { id: e.pointerId, mode: "dig", x: px, y: py, dist: 0 };
          return;
        }
        // winter: rub the snow heap to roll a snowman
        if (state.winter && (state.snowN || 0) < 3 && nearSnowman(px, py) && !hitUnicorn(px, py)) {
          snowStep(px, py);
          touch = { id: e.pointerId, mode: "snow", x: px, y: py, dist: 0 };
          return;
        }
      }
      if (place === "eng" && !asleep()) {
        // a butterfly flutters off when it is tapped
        for (var bi = 0; bi < butterflies.length; bi++) {
          var bf = butterflies[bi], bs = screenOf(bf.position);
          if (bf.visible && bf.userData.away <= 0 && Math.hypot(px - bs[0], py - bs[1]) < 36) {
            bf.userData.away = 2.5;
            burst("star", bs, 5); tone([1319, 1568, 1760]);
            addStars(1); save(); renderMood();
            award("fly");
            touch = { id: e.pointerId, mode: "none" };
            return;
          }
        }
        // an apple on the grass can be picked up and carried to the unicorn
        var ap = appleAt(px, py);
        if (ap) {
          ap.mesh.visible = false;
          var ael = icon("apple", 64);
          fx.appendChild(ael);
          ael.style.transform = tr([px, py], 64, 1);
          touch = { id: e.pointerId, mode: "apple", apple: ap, el: ael };
          return;
        }
        // shaking the tree makes an apple fall
        aim(px, py);
        var onTree = ray.intersectObjects(treeMeshes.concat(apples.filter(function(a){ return a.st === "tree"; }).map(function(a){ return a.mesh; })), false);
        if (onTree.length && !hitUnicorn(px, py)) {
          shakeTree();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
      }
      if (place === "bane") {
        aim(px, py);
        var ch = ray.intersectObjects(courseMeshes, false);
        if (ch.length && !hitUnicorn(px, py)) {
          tapFence(ch[0].object.userData.fence);
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
      }
      var hu = foalFront(px, py) ? null : hitUnicorn(px, py);      // the baby in front of the big one is the baby
      var mode = hu ? "uni" : (hitCat(px, py) ? "cat" : (nearFoalBody(px, py) ? "foal" : "bg"));
      touch = { id: e.pointerId, mode: mode, obj: hu ? hu.object : null, x0: px, y0: py, x: px, y: py,
                dist: 0, n: 0, moved: false, rot0: uni.rotation.y };
    });
    function nearFoalBody(x, y){
      if (!state.baby) return false;
      aim(x, y);
      return ray.intersectObjects(foalMeshes, false).length > 0;
    }
    canvas.addEventListener("pointermove", function(e){
      if (ride) {
        if (ride.mode !== "jump" && ((touch && touch.id === e.pointerId) || e.pointerType === "mouse")) steer(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && touch.mode === "pile") {
        var gp = groundAt(e.clientX, e.clientY);
        if (gp) touch.pile.position.set(Math.max(-3.6, Math.min(4, gp.x)), 0.5, Math.max(-1.2, Math.min(2.8, gp.z)));
        return;
      }
      if (!drag) lookAt(e.clientX, e.clientY);
      if (touch && touch.id === e.pointerId && touch.mode === "apple") {
        touch.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
        act.wants = nearMouth(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && touch.mode === "food") {
        touch.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
        act.wants = touch.food.kind !== "cookie" && nearMouth(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && (touch.mode === "dig" || touch.mode === "snow")) {
        // every bit of rubbing digs a little deeper, or packs a little more snow
        touch.dist += Math.hypot(e.clientX - touch.x, e.clientY - touch.y);
        touch.x = e.clientX; touch.y = e.clientY;
        while (touch.dist > 30) {
          touch.dist -= 30;
          if (touch.mode === "snow") { if ((state.snowN || 0) < 3) snowStep(e.clientX, e.clientY); }
          else if (dig.on) digStep(e.clientX, e.clientY);
        }
        return;
      }
      if (touch && touch.id === e.pointerId && touch.mode === "horn") return;
      if (!touch || touch.id !== e.pointerId || touch.mode === "steer" || touch.mode === "none") return;
      var step = Math.hypot(e.clientX - touch.x, e.clientY - touch.y);
      touch.x = e.clientX; touch.y = e.clientY;
      if (Math.hypot(touch.x - touch.x0, touch.y - touch.y0) > 10) touch.moved = true;
      if (touch.mode === "foal") {
        // a finger dragged away from the baby: it runs after it
        if (touch.moved && !asleep()) {
          var fg = groundAt(e.clientX, e.clientY);
          if (fg) { foalGoTo(fg.x, fg.z); foalPlay.hold = true; foalPlay.fetch = false; }
        }
        return;
      }
      if (touch.mode === "bg") {
        // dragging beside the unicorn turns it round
        if (touch.moved) uni.rotation.y = touch.rot0 + (touch.x - touch.x0) * 0.012;
        return;
      }
      touch.dist += step;
      if (touch.dist > 55) {
        touch.dist = 0; touch.n += 1;
        // in the hair salon, a stroke along the loose mane braids it
        if (touch.mode === "uni" && part === "hair" && !asleep() && (cur().braidN || 0) < 4) {
          var onMane = hitUnicorn(e.clientX, e.clientY);
          if (onMane && onMane.object.userData.seg !== undefined) { braidStep([e.clientX, e.clientY]); return; }
        }
        burst("heart", [e.clientX, e.clientY], 1);
        if (touch.mode === "cat") {
          act.catPurr = 0.7;
          if (touch.n % 3 === 1) { tone([196, 220], "sine", .12); catHop(); }   // purr
        } else {
          act.petting = 0.7;
          if (touch.n % 3 === 1) tone([784]);
        }
      }
    });
    function lift(e){
      if (!touch || touch.id !== e.pointerId) return;
      var t = touch; touch = null;
      if (t.mode === "steer") { if (ride) ride.target = 0; return; }
      if (t.mode === "pile") {
        var pile = t.pile, bx = barn.barrow.position;
        // let go over the wheelbarrow (as the finger sees it) or right beside it
        if (hitAny(barn.barrowMeshes, e.clientX, e.clientY) || Math.hypot(pile.position.x - bx.x, pile.position.z - bx.z) < 1.1) {
          // into the wheelbarrow
          var u = cur();
          pile.userData.gone = true;
          u.dirt = Math.max(0, u.dirt - 1);
          addStars(1);
          if (u.dirt === 0) { addStars(1); burst("star", P.body(), 10); tone([523, 659, 784, 1047]); react("joy"); award("barn"); }
          else tone([392, 523]);
          save(); renderLook(); renderMood();
        } else {
          pile.position.y = 0.15;               // put down where it was let go
        }
        return;
      }
      if (t.mode === "apple") {
        var apl = t.apple;
        act.wants = false;
        t.el.remove();
        if (e.type !== "pointercancel" && nearMouth(e.clientX, e.clientY)) {
          // the unicorn eats the apple; a new one grows on the tree after a while
          apl.st = "gone"; apl.t = 25;
          react("munch"); eatSound("carrot");
          give("carrot", 20);
          addStars(1);
          save(); renderLook(); renderMood();
          burst("heart", P.head(), 5);
          award("apple");
        } else {
          var gp2 = groundAt(e.clientX, e.clientY);
          if (gp2) apl.mesh.position.set(Math.max(-3.4, Math.min(4.2, gp2.x)), 0.17, Math.max(0, Math.min(2.6, gp2.z)));
          apl.mesh.visible = true;
        }
        return;
      }
      if (t.mode === "food") {
        act.wants = false;
        t.el.remove();
        // eaten if it was let go at the right mouth; otherwise it goes back on the blanket
        if (e.type === "pointercancel" || !foodTaken(t.food, e.clientX, e.clientY)) {
          t.food.group.visible = true;
          if (e.type !== "pointercancel") tone([330]);
        } else renderLook();
        return;
      }
      if (t.mode === "horn") {
        magic.hold = false;
        hornGlow(0);
        if (e.type === "pointercancel") return;
        if (magic.ready) castMagic();
        else { pet(); say("Hold fingeren på hornet!", "wand"); }
        return;
      }
      if (t.mode === "dig" || t.mode === "snow") return;
      if (t.mode === "foal" && t.moved) { foalPlay.hold = false; foalPlay.wait = 2.5; return; }
      if (t.mode === "none" || e.type === "pointercancel") return;
      if (t.mode === "uni" && t.n === 0 && !t.moved) {
        // the tail and mane blocks are an instrument; anywhere else is a pat
        if (t.obj && t.obj.userData.note !== undefined && !asleep()) playNote(t.obj, e.clientX, e.clientY);
        else pet();
      }
      else if (t.mode === "cat" && t.n === 0 && !t.moved) petCat();
      else if (t.mode === "foal" && !t.moved) {
        if (!asleep()) foalTrick();
        burst("heart", screenOf(local(F.head, 0.3, 1.0, 0)), asleep() ? 2 : 5);
      }
      else if (t.mode === "bg" && !t.moved) {
        // a tap in a puddle makes a splash; a tap on the grass throws yarn
        var pd = place === "eng" && !asleep() ? puddleAt(groundAt(e.clientX, e.clientY)) : null;
        if (pd) splash(pd); else throwYarn(e.clientX, e.clientY);
      }
    }
    canvas.addEventListener("pointerup", lift);
    canvas.addEventListener("pointercancel", lift);
    canvas.addEventListener("pointerleave", function(e){ if (ride && e.pointerType === "mouse") ride.target = 0; });
    canvas.addEventListener("keydown", function(e){
      if (e.key === "Enter" || (e.key === " " && !ride)) { e.preventDefault(); pet(); }
    });
    document.addEventListener("keydown", function(e){
      if (!ride || e.target.id === "navn") return;
      if (e.key === " " || e.key === "ArrowUp") {
        e.preventDefault();
        if (ride.mode === "jump") { hop(); return; }
        ride.target = Math.max(0, rideTop() - UNI_TOP * RIDE_SCALE);
        setTimeout(function(){ if (ride) ride.target = 0; }, 550);
      }
    });
    document.addEventListener("pointermove", function(e){
      if (!drag && !ride && e.target !== canvas) lookAt(e.clientX, e.clientY);
    });

    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ part = t.dataset.part; renderPanel(); });
    });

    $("navn").addEventListener("input", function(){
      cur().name = $("navn").value.slice(0, 12); save();
    });
    $("navn").addEventListener("blur", renderPanel);

    var armed = 0;
    $("slett").addEventListener("click", function(){
      var b = $("slett");
      if (state.list.length < 2) return;
      if (Date.now() - armed < 3000) {
        state.list.splice(state.cur, 1);
        state.cur = 0; armed = 0;
        b.textContent = "Slett";
        save(); render();
      } else {
        armed = Date.now();
        b.textContent = "Sikker?";
        setTimeout(function(){ if (armed && Date.now() - armed >= 3000) { armed = 0; b.textContent = "Slett"; } }, 3100);
      }
    });

    // for the play-tests only: opened with #test, the page shows where things are on screen and lets a test skip the waiting
    if (location.hash === "#test") {
      var spot = function(o, y){ var w = o.getWorldPosition(new T.Vector3()); if (y !== undefined) w.y = y; return screenOf(w); };
      window.__t = {
        spots: function(){
          return {
            basket: spot(basket, 0.35), foods: foods.map(function(f){ return spot(f.group, 0.2); }),
            mound: spot(mound, 0.1), snowman: spot(snowman, 0.5), cat: P.cat(), mouth: P.mouth(), catMouth: P.catMouth(),
            foal: screenOf(local(F.head, 0.3, 0.2, 0)), tub: screenOf(local(uni, 0, 0.6, 1.0)), body: P.body(),
            horn: uniMeshes.filter(function(o){ return o.userData.horn; }).map(function(o){ return spot(o); }),
            notes: uniMeshes.filter(function(o){ return o.userData.note !== undefined; }).map(function(o){ return spot(o); })
          };
        },
        dig: dig, seek: seek, picnic: picnic, bath: bath, parade: parade, magic: magic, act: act,
        proj: function(x, y, z){ return screenOf(new T.Vector3(x, y, z)); },
        notes: function(){ return noteTimes.length; },
        baby: function(){ return { pos: [foal.position.x, foal.position.z], body: screenOf(local(F.body, 0, 1.95, 0)), ball: spot(toyBall), toy: toy.st, scale: foal.scale.x, level: trickLevel(), mud: F.mud[0].visible }; },
        state: function(){ return state; }
      };
    }

    // needs sink slowly while playing; they stop at 10, so nothing is ever lost
    setInterval(function(){
      if (drag) return;
      var u = cur(), changed = false;
      // in the barn the unicorn helps itself from the hay rack and the trough
      if (place === "stall") {
        [["rack", "hay"], ["trough", "water"]].forEach(function(p){
          if (u[p[0]] > 0 && u[p[1]] < 100) {
            var a = Math.min(4, u[p[0]]);
            u[p[0]] -= a; u[p[1]] = Math.min(100, u[p[1]] + a);
            changed = true;
          }
        });
      }
      if (!u.asleep) NEEDS.forEach(function(k){
        if (u[k] > 10) { u[k] = Math.max(10, u[k] - 0.6); changed = true; }
      });
      if (!u.asleep && state.baby && u.milk > 10) { u.milk = Math.max(10, u.milk - 0.6); changed = true; }
      if (changed) { u.t = Date.now(); save(); renderLook(); renderMood(); }
    }, 3000);
    setInterval(idle, 5200);

    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        window.claude.hot.snapshot(function(){ return state; });
      }
    } catch(e){}

    frame();
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
