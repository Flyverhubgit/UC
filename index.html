    $("book-close").addEventListener("click", function(){ $("book").hidden = true; $("book-btn").focus(); });
    $("book").addEventListener("click", function(e){ if (e.target === $("book")) $("book").hidden = true; });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape") $("book").hidden = true; });
    $("book-count").textContent = stickerCount();
    if (!state.baby && state.stars >= BABY_AT) babyArrives();

    // fingers on the 3D picture: stroke the animals, turn the unicorn, throw yarn, steer the ride
    var touch = null;
    canvas.addEventListener("pointerdown", function(e){
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      lookAt(e.clientX, e.clientY);
      if (ride) {
        touch = { id: e.pointerId, mode: "steer" };
        if (ride.mode === "jump") hop(); else if (ride.mode === "race") raceTap(); else steer(e.clientX, e.clientY);
        return;
      }
      // a tool taken from where it stands or hangs
      var stn = stationAt(e.clientX, e.clientY);
      if (stn) { touch = stationDown(stn, e); return; }
      if (place === "kanin") { touch = rabDown(e); return; }      // the rabbit garden has its own touches
      if (place === "gris") { touch = pigDown(e); return; }       // and so has the pig pen
      // in the barn, a dirty straw pile can be picked up and carried to the wheelbarrow
      if (place === "stall" && !asleep()) {
        aim(e.clientX, e.clientY);
        var ph = ray.intersectObjects(barn.piles.filter(function(p){ return p.visible; }), false);
        if (ph.length) {
          touch = { id: e.pointerId, mode: "pile", pile: ph[0].object, x0: e.clientX, y0: e.clientY, moved: true, n: 1 };
          return;
        }
      }
      var px = e.clientX, py = e.clientY;
      if (!asleep()) {
        // a high five on the lifted hoof, or a tap during the show for the next trick
        if (highFive(px, py)) { touch = { id: e.pointerId, mode: "none" }; return; }
        if (show.on && hitUnicorn(px, py)) { showTap(); touch = { id: e.pointerId, mode: "none" }; return; }
        // hide and seek: there is the cat!
        if (nearHiddenCat(px, py)) {
          catFound();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // the magic horn: hold a finger on it until it glows
        if (onHorn(px, py)) {
          magic.hold = true; magic.t0 = performance.now(); magic.ready = false;
          touch = { id: e.pointerId, mode: "horn" };
          return;
        }
      }
      if (place === "eng" && !asleep()) {
        // the baby's ball: a tap throws it
        if (ballAt(px, py)) {
          throwBall();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // picnic: food from the blanket is carried to whoever likes it
        var pf = foodAt(px, py);
        if (pf) {
          pf.group.visible = false;
          var fel = icon(pf.kind === "cookie" ? "fish" : pf.kind, 64);
          fx.appendChild(fel);
          fel.style.transform = tr([px, py], 64, 1);
          touch = { id: e.pointerId, mode: "food", food: pf, el: fel };
          return;
        }
        if (hitAny(basketMeshes, px, py) && !hitUnicorn(px, py)) {
          if (picnic.open) say("Gi alle noe godt!", "cake");
          else if (picnic.cool > 0) { say("Kurven er tom. Vent litt!", "cake"); tone([330, 262]); }
          else openPicnic();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
        // treasure: dig where it sparkles, by rubbing or tapping
        if (digAt(groundAt(px, py)) && !hitUnicorn(px, py)) {
          digStep(px, py);
          touch = { id: e.pointerId, mode: "dig", x: px, y: py, dist: 0 };
          return;
        }
        // winter: rub the snow heap to roll a snowman
        // the carrot in the snow is picked up and carried to the snowman's face
        if (noseCarrotAt(px, py)) {
          snowCarrot.visible = false;
          var nel = icon("carrot", 64);
          fx.appendChild(nel);
          nel.style.transform = tr([px, py], 64, 1);
          touch = { id: e.pointerId, mode: "nose", el: nel };
          return;
        }
        if (state.winter && (state.snowN || 0) < 3 && nearSnowman(px, py) && !hitUnicorn(px, py)) {
          snowStep(px, py);
          touch = { id: e.pointerId, mode: "snow", x: px, y: py, dist: 0 };
          return;
        }
      }
      if (place === "eng" && !asleep()) {
        // a butterfly flutters off when it is tapped
        for (var bi = 0; bi < butterflies.length; bi++) {
          var bf = butterflies[bi], bs = screenOf(bf.position);
          if (bf.visible && bf.userData.away <= 0 && Math.hypot(px - bs[0], py - bs[1]) < 36) {
            bf.userData.away = 2.5;
            burst("star", bs, 5); tone([1319, 1568, 1760]);
            addStars(1); save(); renderMood();
            award("fly");
            touch = { id: e.pointerId, mode: "none" };
            return;
          }
        }
        // an apple on the grass can be picked up and carried to the unicorn
        var ap = appleAt(px, py);
        if (ap) {
          ap.mesh.visible = false;
          var ael = icon("apple", 64);
          fx.appendChild(ael);
          ael.style.transform = tr([px, py], 64, 1);
          touch = { id: e.pointerId, mode: "apple", apple: ap, el: ael };
          return;
        }
        // shaking the tree makes an apple fall
        aim(px, py);
        var onTree = ray.intersectObjects(treeMeshes.concat(apples.filter(function(a){ return a.st === "tree"; }).map(function(a){ return a.mesh; })), false);
        if (onTree.length && !hitUnicorn(px, py)) {
          shakeTree();
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
      }
      if (place === "bane") {
        aim(px, py);
        var ch = ray.intersectObjects(courseMeshes, false);
        if (ch.length && !hitUnicorn(px, py)) {
          tapFence(ch[0].object.userData.fence);
          touch = { id: e.pointerId, mode: "none" };
          return;
        }
      }
      var hu = foalFront(px, py) ? null : hitUnicorn(px, py);      // the baby in front of the big one is the baby
      var mode = hu ? "uni" : (hitCat(px, py) ? "cat" : (nearFoalBody(px, py) ? "foal" : "bg"));
      touch = { id: e.pointerId, mode: mode, obj: hu ? hu.object : null, x0: px, y0: py, x: px, y: py,
                dist: 0, n: 0, moved: false, rot0: uni.rotation.y };
    });
    function nearFoalBody(x, y){
      if (!state.baby) return false;
      aim(x, y);
      return ray.intersectObjects(foalMeshes, false).length > 0;
    }
    canvas.addEventListener("pointermove", function(e){
      if (ride) {
        if (ride.mode !== "jump" && ((touch && touch.id === e.pointerId) || e.pointerType === "mouse")) steer(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && (touch.mode === "tool" || touch.mode === "upump" || touch.mode === "uhose")) { stationMove(touch, e); return; }
      if (place === "kanin") { if (touch && touch.id === e.pointerId && touch.mode !== "none") rabMove(e, touch); return; }
      if (place === "gris") { if (touch && touch.id === e.pointerId) pigMove(e, touch); return; }
      if (touch && touch.id === e.pointerId && touch.mode === "pile") {
        var gp = groundAt(e.clientX, e.clientY);
        if (gp) touch.pile.position.set(Math.max(-3.6, Math.min(4, gp.x)), 0.5, Math.max(-1.2, Math.min(2.8, gp.z)));
        return;
      }
      if (!drag) lookAt(e.clientX, e.clientY);
      if (touch && touch.id === e.pointerId && touch.mode === "apple") {
        touch.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
        act.wants = nearMouth(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && touch.mode === "nose") { touch.el.style.transform = tr([e.clientX, e.clientY], 64, 1); return; }
      if (touch && touch.id === e.pointerId && touch.mode === "food") {
        touch.el.style.transform = tr([e.clientX, e.clientY], 64, 1);
        act.wants = touch.food.kind !== "cookie" && nearMouth(e.clientX, e.clientY);
        return;
      }
      if (touch && touch.id === e.pointerId && (touch.mode === "dig" || touch.mode === "snow")) {
        // every bit of rubbing digs a little deeper, or packs a little more snow
        touch.dist += Math.hypot(e.clientX - touch.x, e.clientY - touch.y);
        touch.x = e.clientX; touch.y = e.clientY;
        while (touch.dist > 30) {
          touch.dist -= 30;
          if (touch.mode === "snow") { if ((state.snowN || 0) < 3) snowStep(e.clientX, e.clientY); }
          else if (dig.on) digStep(e.clientX, e.clientY);
        }
        return;
      }
      if (touch && touch.id === e.pointerId && touch.mode === "horn") return;
      if (!touch || touch.id !== e.pointerId || touch.mode === "steer" || touch.mode === "none") return;
      var step = Math.hypot(e.clientX - touch.x, e.clientY - touch.y);
      touch.x = e.clientX; touch.y = e.clientY;
      if (Math.hypot(touch.x - touch.x0, touch.y - touch.y0) > 10) touch.moved = true;
      if (touch.mode === "foal") {
        // a finger dragged away from the baby: it runs after it
        if (touch.moved && !asleep()) {
          var fg = groundAt(e.clientX, e.clientY);
          if (fg) { foalGoTo(fg.x, fg.z); foalPlay.hold = true; foalPlay.fetch = false; }
        }
        return;
      }
      if (touch.mode === "bg") {
        // dragging beside the unicorn turns it round
        if (touch.moved) uni.rotation.y = touch.rot0 + (touch.x - touch.x0) * 0.012;
        return;
      }
      touch.dist += step;
      if (touch.dist > 55) {
        touch.dist = 0; touch.n += 1;
        // in the hair salon, a stroke along the loose mane braids it
        if (touch.mode === "uni" && part === "hair" && !asleep() && (cur().braidN || 0) < 4) {
          var onMane = hitUnicorn(e.clientX, e.clientY);
          if (onMane && onMane.object.userData.seg !== undefined) { braidStep([e.clientX, e.clientY]); return; }
        }
        burst("heart", [e.clientX, e.clientY], 1);
        if (touch.mode === "cat") {
          act.catPurr = 0.7;
          if (touch.n % 3 === 1) { tone([196, 220], "sine", .12); catHop(); }   // purr
        } else {
          act.petting = 0.7;
          if (touch.n % 3 === 1) tone([784]);
        }
      }
    });
    function lift(e){
      if (!touch || touch.id !== e.pointerId) return;
      var t = touch; touch = null;
      if (t.mode === "steer") { if (ride && !ride.halt) ride.target = 0; return; }
      if (t.mode === "tool" || t.mode === "upump" || t.mode === "uhose") { stationUp(t, e); return; }
      if (t.mode === "rcarrot" || t.mode === "rpet" || t.mode === "rgo") { rabUp(t, e); return; }
      if (t.mode === "ppump" || t.mode === "pcarry" || t.mode === "phose" || t.mode === "ppet" || t.mode === "pgo") { pigUp(t, e); return; }
      if (t.mode === "pile") {
        var pile = t.pile, bx = barn.barrow.position;
        // let go over the wheelbarrow (as the finger sees it) or right beside it
        if (hitAny(barn.barrowMeshes, e.clientX, e.clientY) || Math.hypot(pile.position.x - bx.x, pile.position.z - bx.z) < 1.1) {
          // into the wheelbarrow
          var u = cur();
          pile.userData.gone = true;
          u.dirt = Math.max(0, u.dirt - 1);
          addStars(1);
          if (u.dirt === 0) { addStars(1); burst("star", P.body(), 10); tone([523, 659, 784, 1047]); react("joy"); award("barn"); }
          else tone([392, 523]);
          save(); renderLook(); renderMood();
        } else {
          pile.position.y = 0.15;               // put down where it was let go
        }
        return;
      }
      if (t.mode === "apple") {
        var apl = t.apple;
        act.wants = false;
        t.el.remove();
        if (e.type !== "pointercancel" && friend && nearFriend(e.clientX, e.clientY)) {
          // the visiting friend gets the apple it asked for
          apl.st = "gone"; apl.t = 25;
          friendHappy();
        } else if (e.type !== "pointercancel" && nearMouth(e.clientX, e.clientY)) {
          // the unicorn eats the apple; a new one grows on the tree after a while
          apl.st = "gone"; apl.t = 25;
          react("munch"); eatSound("carrot");
          give("carrot", 20);
          addStars(1);
          save(); renderLook(); renderMood();
          burst("heart", P.head(), 5);
          award("apple");
        } else {
          var gp2 = groundAt(e.clientX, e.clientY);
          if (gp2) apl.mesh.position.set(Math.max(-3.4, Math.min(4.2, gp2.x)), 0.17, Math.max(0, Math.min(2.6, gp2.z)));
          apl.mesh.visible = true;
        }
        return;
      }
      if (t.mode === "nose") {
        t.el.remove();
        if (e.type !== "pointercancel" && nearSnowman(e.clientX, e.clientY)) giveNose();
        else { applyWinter(); if (e.type !== "pointercancel") tone([330]); }      // back in the snow
        return;
      }
      if (t.mode === "food") {
        act.wants = false;
        t.el.remove();
        // eaten if it was let go at the right mouth; otherwise it goes back on the blanket
        if (e.type === "pointercancel" || !foodTaken(t.food, e.clientX, e.clientY)) {
          t.food.group.visible = true;
          if (e.type !== "pointercancel") tone([330]);
        } else renderLook();
        return;
      }
      if (t.mode === "horn") {
        magic.hold = false;
        hornGlow(0);
        if (e.type === "pointercancel") return;
        if (magic.ready) castMagic();
        else { pet(); say("Hold fingeren på hornet!", "wand"); }
        return;
      }
      if (t.mode === "dig" || t.mode === "snow") return;
      if (t.mode === "foal" && t.moved) { foalPlay.hold = false; foalPlay.wait = 2.5; return; }
      if (t.mode === "none" || e.type === "pointercancel") return;
      if (t.mode === "uni" && t.n === 0 && !t.moved) {
        // the tail and mane blocks are an instrument; anywhere else is a pat
        if (t.obj && t.obj.userData.note !== undefined && !asleep()) playNote(t.obj, e.clientX, e.clientY);
        else pet();
      }
      else if (t.mode === "cat" && t.n === 0 && !t.moved) petCat();
      else if (t.mode === "foal" && !t.moved) {
        if (!asleep()) foalTrick();
        burst("heart", screenOf(local(F.head, 0.3, 1.0, 0)), asleep() ? 2 : 5);
      }
      else if (t.mode === "bg" && !t.moved) {
        // a tap in a puddle makes a splash; a tap on the grass throws yarn
        var pd = place === "eng" && !asleep() ? puddleAt(groundAt(e.clientX, e.clientY)) : null;
        if (pd) splash(pd); else throwYarn(e.clientX, e.clientY);
      }
    }
    canvas.addEventListener("pointerup", lift);
    canvas.addEventListener("pointercancel", lift);
    canvas.addEventListener("pointerleave", function(e){ if (ride && !ride.halt && e.pointerType === "mouse") ride.target = 0; });
    canvas.addEventListener("keydown", function(e){
      if (e.key === "Enter" || (e.key === " " && !ride)) { e.preventDefault(); pet(); }
    });
    document.addEventListener("keydown", function(e){
      if (!ride || e.target.id === "navn") return;
      if (e.key === " " || e.key === "ArrowUp") {
        e.preventDefault();
        if (ride.mode === "jump") { hop(); return; }
        if (ride.mode === "race") { raceTap(); return; }
        if (ride.halt) return;
        ride.target = Math.max(0, rideTop() - UNI_TOP * RIDE_SCALE);
        setTimeout(function(){ if (ride && !ride.halt) ride.target = 0; }, 550);
      }
    });
    document.addEventListener("pointermove", function(e){
      if (!drag && !ride && e.target !== canvas) lookAt(e.clientX, e.clientY);
    });

    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ if (t.dataset.pet) petPart = t.dataset.pet; else part = t.dataset.part; renderPanel(); });
    });

    $("navn").addEventListener("input", function(){
      (petNow() || cur()).name = $("navn").value.slice(0, 12); save();
    });
    $("navn").addEventListener("blur", renderPanel);

    var armed = 0;
    $("slett").addEventListener("click", function(){
      var b = $("slett");
      if (state.list.length < 2) return;
      if (Date.now() - armed < 3000) {
        state.list.splice(state.cur, 1);
        state.cur = 0; armed = 0;
        b.textContent = "Slett";
        save(); render();
      } else {
        armed = Date.now();
        b.textContent = "Sikker?";
        setTimeout(function(){ if (armed && Date.now() - armed >= 3000) { armed = 0; b.textContent = "Slett"; } }, 3100);
      }
    });

    // for the play-tests only: opened with #test, the page shows where things are on screen and lets a test skip the waiting
    if (location.hash === "#test") {
      var spot = function(o, y){ var w = o.getWorldPosition(new T.Vector3()); if (y !== undefined) w.y = y; return screenOf(w); };
      window.__t = {
        spots: function(){
          return {
            basket: spot(basket, 0.35), foods: foods.map(function(f){ return spot(f.group, 0.2); }),
            mound: spot(mound, 0.1), snowman: spot(snowman, 0.5), snowCarrot: spot(snowCarrot, 0), snowCarrotShown: snowCarrot.visible, cat: P.cat(), mouth: P.mouth(), catMouth: P.catMouth(),
            foal: screenOf(local(F.head, 0.3, 0.2, 0)), tub: screenOf(local(uni, 0, 0.6, 1.0)), body: P.body(),
            horn: uniMeshes.filter(function(o){ return o.userData.horn; }).map(function(o){ return spot(o); }),
            notes: uniMeshes.filter(function(o){ return o.userData.note !== undefined; }).map(function(o){ return spot(o); })
          };
        },
        dig: dig, seek: seek, picnic: picnic, bath: bath, parade: parade, magic: magic, act: act,
        proj: function(x, y, z){ return screenOf(new T.Vector3(x, y, z)); },
        notes: function(){ return noteTimes.length; },
        ride: function(){ return ride ? { kind: ride.kind, t: ride.t, y: ride.y, got: ride.got, halt: ride.halt, goal: !!ride.goal, rings: ride.rings, dist: ride.dist || 0, v: ride.v || 0, place: ride.place || 0, items: ride.stars.length, props: ride.props.length } : null; },
        rideObj: function(){ return ride; },
        friend: function(come){
          if (come && !friend) friendComes();
          if (come === "shake") shakeTree();
          return { kind: friend ? friend.kind : "", phase: friend ? friend.phase : "", at: friend ? screenOf(tmp2.copy(friend.mesh.position).setY(0.7)) : null,
                   wish: !document.getElementById("wish-friend").hidden, icon: document.getElementById("wish-friend-icon").getAttribute("href"),
                   apples: apples.map(function(a){ return a.st === "ground" ? screenOf(a.mesh.position) : null; }) };
        },
        sound: function(){ return { played: SND.played.slice(), said: SAY.said.slice(), on: soundOn(), ctx: ac ? ac.state : "", voice: SAY.voice ? SAY.voice.lang : "", shown: SAY.shown }; },
        playAll: function(){           // every recipe once, without the safety net, so a mistake in one shows up as an error
          var bad = [];
          Object.keys(SOUNDS).forEach(function(n){ try { SOUNDS[n](); } catch(e){ bad.push(n + ": " + e.message); } });
          return { count: Object.keys(SOUNDS).length, bad: bad, ctx: ac ? ac.state : "none" };
        },
        stations: function(){
          var o = {};
          (STATIONS[place] || []).forEach(function(st){ if (!o[st.kind]) o[st.kind] = screenOf(st.at.clone()); });
          o.grip = screenOf(local(barnPump.handle, 0, 0, 1.3));
          o.rack = screenOf(new T.Vector3(-2.2, 3.4, -2.2)); o.need = curNeed; o.goStall = game.classList.contains("go-stall");
          o.tilesShown = getComputedStyle(document.querySelector(".care")).display !== "none";
          return o;
        },
        pig: function(){
          var p = pigState(), v = function(x, y, z){ return screenOf(new T.Vector3(x, y, z)); };
          return { body: pigBodyAt(), pos: [pigM.position.x, pigM.position.z], mode: pg.mode, state: JSON.parse(JSON.stringify(p)),
                   grip: screenOf(local(PN.handle, 0, 0, 1.3)), bin: v(BARREL.x, 0.9, BARREL.z), trough: troughAt(), hose: v(HOSE.x + 0.45, 0.6, HOSE.z + 0.26),
                   pit: v(PIT.x, 0.05, PIT.z), barrow: v(BARROW.x, 0.6, BARROW.z), ground: v(1.6, 0, 2.2),
                   piles: PN.piles.map(function(c){ return c.g.visible ? screenOf(c.g.getWorldPosition(new T.Vector3()).setY(0.3)) : null; }),
                   uni: uni.visible, cat: cat.visible };
        },
        rab: function(){
          return { mouth: rabMouth(), body: rabBody(), pos: [rab.position.x, rab.position.z], tunnel: rb.tunnel, dirty: rabbit().dirty,
                   house: rb.house || "", shown: rab.visible, peek: RB.peek.visible, door: screenOf(tmp2.set(DOOR.x, 0.9, -1.4)), roof: screenOf(tmp2.set(-2.9, 2.3, -1.3)),
                   bed: bedAt(), bedState: [Math.round(rabbit().bed), rabbit().bedOut, rabbit().bedIn], bedShown: RB.bed.map(function(c){ return c.m.visible ? (c.m.material === M.sponOld ? "old" : "new") : "-"; }),
                   needs: RAB_NEEDS.map(function(k){ return Math.round(rabbit()[k]); }),
                   carrots: patchCarrots.map(function(c){ return c.g.visible ? screenOf(c.g.getWorldPosition(new T.Vector3()).setY(0.4)) : null; }),
                   tunnelAt: screenOf(new T.Vector3((TUNNEL.x0 + TUNNEL.x1) / 2, 0.6, TUNNEL.z)),
                   mud: screenOf(new T.Vector3(RAB_MUD.x, 0, RAB_MUD.z)), uni: uni.visible, cat: cat.visible, foal: foal.visible };
        },
        load: function(){ return { triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, shapes: Object.keys(boxCache).length }; },
        hoofs: function(){ return [0, 1, 2, 3].map(hoofSpot); }, show: show, trick: function(){ return act.trick ? act.trick.k : ""; },
        baby: function(){ return { pos: [foal.position.x, foal.position.z], body: screenOf(local(F.body, 0, 1.95, 0)), ball: spot(toyBall), toy: toy.st, scale: foal.scale.x, level: trickLevel(), mud: F.mud[0].visible }; },
        state: function(){ return state; }
      };
    }

    // needs sink slowly while playing; they stop at 10, so nothing is ever lost
    setInterval(function(){
      if (drag) return;
      var u = cur(), changed = false;
      // in the barn the unicorn helps itself from the hay rack and the trough
      if (place === "stall") {
        [["rack", "hay"], ["trough", "water"]].forEach(function(p){
          if (u[p[0]] > 0 && u[p[1]] < 100) {
            var a = Math.min(8, u[p[0]]);
            u[p[0]] -= a; u[p[1]] = Math.min(100, u[p[1]] + a);
            changed = true;
          }
        });
      }
      if (!u.asleep) NEEDS.forEach(function(k){
        if (u[k] > 10) { u[k] = Math.max(10, u[k] - 0.6); changed = true; }
      });
      if (!u.asleep && state.baby && u.milk > 10) { u.milk = Math.max(10, u.milk - 0.6); changed = true; }
      // the rabbit gets hungry and scruffy too, a little more slowly
      var r = rabbit();
      RAB_NEEDS.forEach(function(k){ if (r[k] > 10) { r[k] = Math.max(10, r[k] - 0.4); changed = true; } });
      if (r.bed > 0) { r.bed = Math.max(0, r.bed - 0.5); changed = true; if (place === "kanin") bedLook(); }      // the bed slowly gets dirty
      // and the pig; the mud bath slowly dries out
      var pp = pigState();
      PIG_NEEDS.forEach(function(k){ if (pp[k] > 10) { pp[k] = Math.max(10, pp[k] - 0.4); changed = true; } });
      if (pp.pit > 0 && pp.pit < 100) pp.pit = Math.max(0, pp.pit - 0.5);
      if (changed) { u.t = Date.now(); save(); renderLook(); renderMood(); }
    }, 3000);
    setInterval(idle, 5200);

    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        window.claude.hot.snapshot(function(){ return state; });
      }
    } catch(e){}

    frame();
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
