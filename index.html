<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enhjørningen min</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. A 3D meadow with the unicorn and cat, care tools, colour box.
     Phone: stacked. Wide screen: stage left, controls right. Single theme on purpose. */
  color-scheme: light;
  --sky-1:#bfe0ff;
  --sky-2:#ead9ff;
  --sky-3:#ffe1ec;
  --ink:#4a2f6b;
  --panel:rgba(255,255,255,.86);
  --accent:#ff5fa8;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS","Segoe UI",sans-serif;
  --font-body:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%) fixed;
  background-color:var(--sky-2);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:500;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.game{
  height:100%;min-height:640px;
  display:flex;flex-direction:column;gap:10px;
  padding:12px 16px 16px;
  max-width:1100px;margin:0 auto;
}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(22px,4.5vw,34px);line-height:1;margin:0;
  letter-spacing:.01em;
  text-shadow:0 2px 0 #fff;
}
.stars{
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border-radius:999px;padding:6px 14px 6px 8px;
  font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;
}
.stars svg{width:26px;height:26px}
.stable{display:flex;align-items:center;gap:8px;margin-left:auto}
.chip{
  width:46px;height:46px;border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 2px 0 rgba(74,47,107,.25);
  position:relative;
}
.chip[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.chip.add{
  background:var(--panel);border-style:dashed;border-color:var(--ink);border-width:3px;
  font-size:28px;font-weight:700;line-height:1;
}

/* stage: the 3D picture fills it, sky decorations sit behind, buttons and bubble in front */
.stage{
  position:relative;flex:1 1 auto;min-height:250px;
  border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);
  touch-action:none;
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab}
.cloud{position:absolute;height:26px;border-radius:999px;background:#fff;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44%;height:190%;left:14%;top:-95%}
.cloud::after{width:34%;height:140%;right:16%;top:-60%}
.cloud.c1{width:110px;left:6%;top:16%}
.cloud.c2{width:80px;right:8%;top:30%;opacity:.75}
.rainbow{
  position:absolute;left:50%;bottom:30%;width:min(96%,720px);transform:translateX(-50%);
  opacity:0;transition:opacity 1.2s ease;
}
.happy .rainbow{opacity:.85}
.riding .cloud{animation:drift 7s linear infinite}
.riding .cloud.c2{animation-delay:-3.5s}
@keyframes drift{from{transform:translateX(100vw)}to{transform:translateX(-60vw)}}
.no3d{
  position:absolute;inset:0;z-index:2;display:none;place-items:center;text-align:center;
  padding:24px;font-family:var(--font-display);font-weight:600;font-size:20px;
}
.no3d.show{display:grid}

.stage-actions{
  position:absolute;left:4%;bottom:5%;z-index:3;
  display:flex;gap:10px;align-items:center;
}
.ride-btn{
  background:var(--accent);color:#fff;border-radius:999px;
  padding:10px 22px;min-height:54px;
  font-family:var(--font-display);font-weight:700;font-size:20px;
  box-shadow:0 5px 0 rgba(74,47,107,.3);
}
.yarn-btn{
  width:54px;height:54px;border-radius:50%;background:var(--panel);
  box-shadow:0 5px 0 rgba(74,47,107,.22);
  display:grid;place-items:center;touch-action:none;
}
.yarn-btn svg{width:36px;height:36px}
.ride-btn:active,.yarn-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,47,107,.3)}
.riding .yarn-btn{display:none}

.bubble{
  position:absolute;right:5%;top:6%;z-index:3;
  display:flex;align-items:center;gap:8px;
  background:#fff;border-radius:22px;padding:8px 14px 8px 10px;
  font-family:var(--font-display);font-weight:600;font-size:clamp(16px,3.2vw,22px);
  box-shadow:0 3px 0 rgba(74,47,107,.2);
  max-width:64%;
  pointer-events:none;
}
.bubble svg{width:34px;height:34px;flex:none}
.bubble::after{
  content:"";position:absolute;left:28px;bottom:-12px;
  border:12px solid transparent;border-top-color:#fff;border-bottom:0;
}

/* care tools: they are picked up and used with a finger */
.care{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{
  background:var(--panel);border-radius:22px;padding:8px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 5px 0 rgba(74,47,107,.22);
  font-family:var(--font-display);font-weight:600;font-size:clamp(13px,3.2vw,18px);
  transition:transform .08s ease, box-shadow .08s ease;
  touch-action:none;
}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,47,107,.22)}
.act svg{width:clamp(36px,8vw,56px);height:clamp(36px,8vw,56px)}
.act.need{animation:need 1s ease-in-out infinite;background:#fff}
.act.held svg{opacity:.25}
@keyframes need{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.meter{width:100%;height:12px;border-radius:999px;background:rgba(74,47,107,.14);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;width:50%;transition:width .3s ease}
#m-carrot{background:#ff8a3c}
#m-hay{background:#e0b63a}
#m-water{background:#4db8ff}
#m-brush{background:#ff8fc7}
#m-wash{background:#5fd3c8}

/* colour box */
.paint{
  background:var(--panel);border-radius:24px;padding:10px 12px 12px;
  display:flex;flex-direction:column;gap:10px;
}
.paint-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  border-radius:999px;padding:8px 14px;min-height:44px;
  font-family:var(--font-display);font-weight:600;font-size:17px;
  background:rgba(74,47,107,.1);
}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.sw{
  width:48px;height:48px;border-radius:50%;
  border:4px solid #fff;box-shadow:0 2px 0 rgba(74,47,107,.3);
}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.accbtn{
  display:flex;align-items:center;gap:8px;
  border-radius:18px;padding:6px 14px 6px 8px;min-height:52px;
  background:#fff;box-shadow:0 2px 0 rgba(74,47,107,.3);
  font-family:var(--font-display);font-weight:600;font-size:17px;
}
.accbtn svg{width:38px;height:38px}
.accbtn[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.accbtn.locked{background:rgba(74,47,107,.1);box-shadow:none}
.accbtn.locked svg.pic{opacity:.35}
.accbtn .cost{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.accbtn .cost svg{width:20px;height:20px}
.name-row{display:flex;gap:8px;align-items:center;margin-left:auto}
#navn{
  width:150px;min-height:44px;border-radius:999px;border:3px solid rgba(74,47,107,.25);
  background:#fff;padding:4px 14px;font-weight:600;font-size:18px;
  -webkit-user-select:text;user-select:text;
}
#slett{
  min-height:44px;border-radius:999px;padding:4px 14px;
  background:rgba(74,47,107,.1);font-weight:600;font-size:16px;
}
#slett[hidden]{display:none}

/* flying things */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
#fx > *{position:absolute;left:0;top:0;will-change:transform,opacity}

@media (min-width:820px) and (min-aspect-ratio:1/1){
  .game{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(320px,400px);
    grid-template-rows:auto 1fr auto;
    column-gap:16px;
    min-height:560px;
  }
  .top{grid-column:1 / -1}
  .stage{grid-row:2 / 4;min-height:0}
  .care{align-self:start;grid-template-columns:repeat(3,1fr);gap:10px}
  .act{font-size:18px}
  .act svg{width:52px;height:52px}
  .paint{align-self:end}
  .name-row{margin-left:0;width:100%}
  #navn{flex:1;width:auto}
}
@media (max-width:480px){
  .sw{width:42px;height:42px}
  .name-row{margin-left:0;width:100%}
  #navn{flex:1;width:auto}
  .game{padding:10px 12px 14px}
  .tab{padding:8px 11px;font-size:16px}
  .stage-actions{top:5%;bottom:auto;left:3%;gap:6px;flex-direction:column;align-items:flex-start}
  .ride-btn{padding:8px 14px;min-height:46px;font-size:17px}
  .yarn-btn{width:46px;height:46px}
  .yarn-btn svg{width:30px;height:30px}
  .bubble{right:3%;max-width:56%;font-size:15px;padding:6px 10px 6px 8px}
  .bubble svg{width:26px;height:26px}
}
@media (prefers-reduced-motion:reduce){
  .act.need{animation:none}
  .rainbow{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-carrot" viewBox="0 0 48 48">
      <path d="M33 15c-1-5 1-9 4-11 1 3 0 6-1 8 3-2 6-2 9-1-2 4-7 6-12 4z" fill="#5cc66a"/>

    </symbol>

<main class="game" id="game">
  <header class="top">
    <h1>Enhjørningen min</h1>
    <div class="stars" aria-label="Stjerner">
      <svg aria-hidden="true"><use href="#i-star"/></svg><span id="stars">0</span>
    </div>
    <div class="stable" id="stable" aria-label="Velg enhjørning"></div>
  </header>

  <section class="stage" id="stage" aria-label="Enhjørningen">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <svg class="rainbow" viewBox="0 0 720 360" aria-hidden="true" fill="none" stroke-width="18">
      <path d="M40 360a320 320 0 0 1 640 0" stroke="#ff5a6e"/>
      <path d="M58 360a302 302 0 0 1 604 0" stroke="#ffa63c"/>
      <path d="M76 360a284 284 0 0 1 568 0" stroke="#ffe04a"/>
      <path d="M94 360a266 266 0 0 1 532 0" stroke="#5cd07a"/>
      <path d="M112 360a248 248 0 0 1 496 0" stroke="#4db8ff"/>
      <path d="M130 360a230 230 0 0 1 460 0" stroke="#a66bff"/>
    </svg>

    <canvas id="gl" tabindex="0" aria-label="Enhjørningen og katten i 3D. Trykk Enter for å klappe enhjørningen."></canvas>
    <div class="no3d" id="no3d">3D virker ikke på denne enheten. Prøv en annen nettleser.</div>

    <div class="stage-actions">
      <button class="ride-btn" id="ride" type="button">Ri en tur</button>
      <button class="yarn-btn" id="yarn-btn" type="button" aria-label="Kast garnnøste til katten" title="Garnnøste">
        <svg aria-hidden="true"><use href="#i-yarn"/></svg>
      </button>
    </div>

    <div class="bubble" id="bubble" aria-live="polite">
      <svg aria-hidden="true"><use id="bubble-icon" href="#i-heart"/></svg>
      <span id="bubble-text">Hei!</span>
    </div>
  </section>

  <section class="care" aria-label="Stell">
    <button class="act" id="b-carrot" type="button">
      <svg aria-hidden="true"><use href="#i-carrot"/></svg><span>Gulrot</span>
      <span class="meter"><i id="m-carrot"></i></span>
    </button>
    <button class="act" id="b-hay" type="button">
      <svg aria-hidden="true"><use href="#i-hay"/></svg><span>Høy</span>
      <span class="meter"><i id="m-hay"></i></span>
    </button>
    <button class="act" id="b-water" type="button">
      <svg aria-hidden="true"><use href="#i-water"/></svg><span>Vann</span>
      <span class="meter"><i id="m-water"></i></span>
    </button>
    <button class="act" id="b-brush" type="button">
      <svg aria-hidden="true"><use href="#i-brush"/></svg><span>Børste</span>
      <span class="meter"><i id="m-brush"></i></span>
    </button>
    <button class="act" id="b-wash" type="button">
      <svg aria-hidden="true"><use href="#i-wash"/></svg><span>Vask</span>
      <span class="meter"><i id="m-wash"></i></span>
    </button>
  </section>

  <section class="paint" aria-label="Farger og pynt">
    <div class="paint-top">
      <div class="tabs" role="tablist" aria-label="Hva vil du farge?">
        <button class="tab" id="t-body" role="tab" type="button" data-part="body">Kropp</button>
        <button class="tab" id="t-mane" role="tab" type="button" data-part="mane">Man</button>
        <button class="tab" id="t-horn" role="tab" type="button" data-part="horn">Horn</button>
        <button class="tab" id="t-cat" role="tab" type="button" data-part="cat">Katt</button>
        <button class="tab" id="t-acc" role="tab" type="button" data-part="acc">Pynt</button>
      </div>
      <div class="name-row">
        <input id="navn" type="text" maxlength="12" placeholder="Navn" autocomplete="off" aria-label="Navn på enhjørningen">
        <button id="slett" type="button">Slett</button>
      </div>
    </div>
    <div class="swatches" id="swatches"></div>
  </section>
</main>

<div id="fx" aria-hidden="true"></div>

<script src="three.min.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "enhjorning-v1";
  var MAX = 4;
  var COLORS = {
    body: ["#ffffff","#ffc9e0","#e0ccff","#c4e6ff","#c2f2dc","#fff2ad","#ffd6b8","#b79cf0"],
    mane: ["rainbow","#ff5fa8","#a45cf0","#3fa9f5","#25c9b0","#ffc93c","#ff8a3c","#ffffff"],
    horn: ["#ffcf4a","rainbow","#d5dbe8","#ff7fbf","#b98cff","#4fd6c4","#ff9a4a","#ffffff"],
    cat: ["#ffffff","#ffd9a0","#ff9f5a","#c9c9d6","#8a8098","#ffc9e0","#e0ccff","#c4e6ff"]
  };
  // dress-up things, opened by earning stars
  var ACC = [
    { id: "bow", name: "Sløyfe", cost: 5, icon: "bow" },
    { id: "flowers", name: "Blomster", cost: 12, icon: "flower" },
    { id: "wings", name: "Vinger", cost: 25, icon: "wing" }
  ];
  var NEEDS = ["carrot","hay","water","brush","wash"];
  var FOOD = { carrot: true, hay: true, water: true };   // carried to the mouth; the others are rubbed on the coat
  var TEXT = {
    carrot: "Jeg vil ha gulrot!",
    hay: "Jeg vil ha høy!",
    water: "Jeg er tørst!",
    brush: "Børst meg!",
    wash: "Vask meg!",
    ride: "Dra fingeren opp og ned!",
    happy: "Jeg er så glad!",
    ok: "Hei!"
  };
  var HINT = {
    carrot: "Dra gulroten til munnen!",
    hay: "Dra høyet til munnen!",
    water: "Dra vannet til munnen!",
    brush: "Gni med børsten!",
    wash: "Gni med svampen!",
    yarn: "Dra garnnøstet ut på gresset!"
  };
  var MUD_AT = [70, 62, 54, 46, 38, 30, 22, 14];          // a mud patch shows while "wash" is under its number
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function(id){ return document.getElementById(id); };
  var game = $("game"), fx = $("fx"), stage = $("stage"), canvas = $("gl");
  var part = "body";
  var state;
  var ride = null;
  var drag = null;
  var hint = null;

  // --- saved state -----------------------------------------------------------
  function newUnicorn(i){
    return {
      name: "",
      body: COLORS.body[i % COLORS.body.length],
      mane: COLORS.mane[i % COLORS.mane.length],
      horn: COLORS.horn[0],
      cat: COLORS.cat[(i + 1) % COLORS.cat.length],
      acc: {},
      carrot: 55, hay: 60, water: 35, brush: 65, wash: 80,
      t: Date.now()
    };
  }
  function fresh(){ return { list: [newUnicorn(0)], cur: 0, stars: 0 }; }
  function load(hot){
    var s = null;
    if (hot && hot.list && hot.list.length) s = hot;
    if (!s) {
      try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){ s = null; }
    }
    if (!s || !s.list || !s.list.length) s = fresh();
    if (!(s.cur >= 0 && s.cur < s.list.length)) s.cur = 0;
    s.stars = s.stars | 0;
    // needs went down while away, but never to zero: nothing to lose
    var now = Date.now();
    s.list.forEach(function(u){

  // small sounds, only ever started from a touch

        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(type === "square" ? .05 : .12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + (type === "square" ? .12 : .3));

  // --- caring from the keyboard: the tool flies over by itself --------------

  // --- caring with a finger: carry a tool onto the unicorn ------------------
  var lastDragEnd = 0;
  function nearMouth(x, y){
    var m = P.mouth();
    return Math.hypot(x - m[0], y - m[1]) < 1.3 * pxPerUnit() * uni.scale.x;   // generous, for small fingers
  }
  // soap foam stays for a moment where the sponge rubbed

  function dragStart(kind, btn, e){
    if (ride || (e.button && e.button > 0)) return;
    drag = { kind: kind, btn: btn, id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY,
             on: false, el: null, dist: 0, gained: 0, ticks: 0 };

  }
  function dragMove(e){

    var x = e.clientX, y = e.clientY;
    if (!drag.on) {
      if (Math.hypot(x - drag.x0, y - drag.y0) < 10) return;
      drag.on = true;
      drag.el = icon(drag.kind, 72);
      fx.appendChild(drag.el);

          drag.ticks += 1;

  // --- the cat chases a ball of yarn ----------------------------------------
  var yarn = null;
  function clearYarn(){
    yarn = null;
    yarnBall.visible = false;
    cat.position.copy(CAT_HOME);
    cat.rotation.y = CAT_ROT;
  }
  function throwYarn(x, y){
    if (ride || yarn) return;
    var p = groundAt(x, y);
    if (!p) return;
    p.x = Math.max(LOOK.x - view.halfW + 0.6, Math.min(LOOK.x + view.halfW - 0.6, p.x));
    p.z = Math.max(0.9, Math.min(2.6, p.z));       // in front of the unicorn, where the cat can run
    yarn = { p: p, t: 0, phase: "drop", vx: 0, spin: 0 };
    yarnBall.position.set(p.x, 5, p.z);
    yarnBall.visible = true;
    tone([880, 660]);
  }
  function stepYarn(dt){
    if (!yarn) return;
    yarn.t += dt;
    var b = yarnBall.position;
    if (yarn.phase === "drop") {
      var k = Math.min(1, yarn.t / 0.55);
      b.y = 0.24 + (5 - 0.24) * (1 - k * k) + (k >= 1 ? 0 : 0);
      if (k >= 1) { yarn.phase = "run"; yarn.t = 0; }
    }
    if (yarn.phase === "drop" || yarn.phase === "run") {
      // the cat runs to a spot beside the ball
      var side = cat.position.x > yarn.p.x ? 1 : -1;
      var tx = yarn.p.x + side * 0.75, tz = yarn.p.z;
      var dx = tx - cat.position.x, dz = tz - cat.position.z, d = Math.hypot(dx, dz);
      if (d > 0.06) {
        var s = Math.min(d, 5.5 * dt);
        cat.position.x += dx / d * s; cat.position.z += dz / d * s;
        cat.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
      } else if (yarn.phase === "run") {
        yarn.phase = "bat"; yarn.t = 0;
        yarn.vx = -side * 3.2;
        cat.rotation.y = Math.atan2(-side, 0.4) - Math.PI / 2;
        burst("heart", P.cat(), 4);
        tone([1047, 880, 1175]);
        act.catHop = 0.7;
        addStars(1); save(); renderMood();
      }
    } else if (yarn.phase === "bat") {
      b.x += yarn.vx * dt; yarn.vx *= Math.pow(0.12, dt);
      yarnBall.rotation.z -= yarn.vx * dt * 3;
      if (yarn.t > 1.3) { yarn.phase = "home"; yarn.t = 0; }
    } else if (yarn.phase === "home") {
      var hx = CAT_HOME.x - cat.position.x, hz = CAT_HOME.z - cat.position.z, hd = Math.hypot(hx, hz);
      yarnBall.scale.setScalar(Math.max(0.01, 1 - yarn.t * 1.6));
      if (hd > 0.06) {
        var hs = Math.min(hd, 5.5 * dt);
        cat.position.x += hx / hd * hs; cat.position.z += hz / hd * hs;
        cat.rotation.y = Math.atan2(hx, hz) - Math.PI / 2;
      } else { yarnBall.scale.setScalar(1); clearYarn(); }
    }
  }

  // --- riding: the unicorn gallops, steer it up and down to catch stars. No way to lose.
  function startRide(){
    if (ride) return;
    if (yarn) { yarnBall.scale.setScalar(1); clearYarn(); }
    ride = { t: 0, y: 0, target: 0, next: 0.4, stars: [], got: 0, rot0: uni.rotation.y };
    game.classList.add("riding");
    $("ride").textContent = "Stopp";
    U.rider.visible = true;
    renderLook(); renderMood();
    tone([523, 659, 784]);
  }
  function stopRide(){
    if (!ride) return;
    ride.stars.forEach(function(s){ scene.remove(s); });
    ride = null;
    game.classList.remove("riding");
    $("ride").textContent = "Ri en tur";
    U.rider.visible = false;
    U.legs.forEach(function(l){ l.rotation.z = 0; });
    // a ride makes the unicorn hungry, thirsty and muddy
    var u = cur();
    u.carrot = Math.max(10, u.carrot - 8);
    u.hay = Math.max(10, u.hay - 10);
    u.water = Math.max(10, u.water - 15);
    u.wash = Math.max(10, u.wash - 55);
    u.t = Date.now();
    save(); renderLook(); renderMood();
    tone([784, 659, 523]);
  }
  var RIDE_SCALE = 0.5, RIDE_X = -1.9;
  function rideTop(){ return LOOK.y + view.halfH * 0.92; }
  function steer(x, y){
    if (!ride) return;
    var p = sideAt(x, y);
    if (!p) return;
    var max = Math.max(0, rideTop() - UNI_TOP * RIDE_SCALE);
    ride.target = Math.max(0, Math.min(max, p.y - UNI_MID * RIDE_SCALE));
  }
  function stepRide(dt){
    ride.t += dt;
    ride.y += (ride.target - ride.y) * Math.min(1, dt * 7);
    if (ride.t >= ride.next) {
      var s = new T.Mesh(GEO.star, M.gold);
      s.position.set(LOOK.x + view.halfW + 0.6, 0.7 + Math.random() * (rideTop() - 1.2), 0);
      scene.add(s); ride.stars.push(s);
      ride.next = ride.t + 0.7 + Math.random() * 0.5;
    }
    var speed = view.halfW * 2 / 2.6;
    var cx = uni.position.x + 0.4 * RIDE_SCALE, cy = uni.position.y + (UNI_MID + 0.3) * RIDE_SCALE;
    ride.stars = ride.stars.filter(function(s){
      s.position.x -= speed * dt;
      s.rotation.y += dt * 3;
      if (Math.abs(s.position.x - cx) < 2.1 * RIDE_SCALE && Math.abs(s.position.y - cy) < 2.6 * RIDE_SCALE) {
        var p = screenOf(s.position);
        scene.remove(s);
        ride.got += 1;
        addStars(1);
        $("stars").textContent = state.stars;
        burst("star", p, 4);
        tone([988, 1319]);
        return false;
      }
      if (s.position.x < LOOK.x - view.halfW - 1) { scene.remove(s); return false; }
      return true;
    });
    flowers.forEach(function(f){
      f.position.x -= speed * dt;
      if (f.position.x < -9) f.position.x += 18;
    });
    if (ride.t > 30) stopRide();
  }

  // --- the 3D loop: everything that moves ------------------------------------
  var clock = new T.Clock(), time = 0;
  function ease(a, b, k){ return a + (b - a) * Math.min(1, k); }
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    time += dt;
    var now = performance.now();
    var u = cur();
    var happy = game.classList.contains("happy");

    if (ride) stepRide(dt);
    stepYarn(dt);

    // where the unicorn stands, how big it is, which way it faces
    var k = dt * 6;
    var sc = ease(uni.scale.x, ride ? RIDE_SCALE : 1, k);
    uni.scale.setScalar(sc);
    uni.position.x = ease(uni.position.x, ride ? RIDE_X : HOME_X, k);
    if (ride) uni.rotation.y = ease(uni.rotation.y, 0, k);
    var jump = 0;
    if (act.joy > 0) {
      act.joy = Math.max(0, act.joy - dt);
      var j = 1 - act.joy / 0.8;
      jump = Math.abs(Math.sin(j * Math.PI * 2)) * 0.55 * (1 - j * 0.6);
    }
    var gallop = ride ? Math.abs(Math.sin(time * 13)) * 0.12 : 0;
    uni.position.y = (ride ? ride.y : 0) + jump + gallop;
    uni.rotation.z = ride ? Math.sin(time * 13) * 0.05 : 0;

    // breathing, tail, legs
    var wag = ride ? 9 : 2.2;
    U.tail.rotation.z = Math.sin(time * wag) * (ride ? 0.3 : 0.12) + (ride ? 0.5 : 0);
    U.tail.rotation.y = Math.sin(time * 1.6) * 0.25;
    if (ride) {
      U.legs.forEach(function(l, i){ l.rotation.z = Math.sin(time * 13 + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.7; });
    } else {
      U.legs.forEach(function(l, i){
        var paw = act.idle === "paw" && i === 0 ? Math.max(0, Math.sin(act.idleT * 12)) * 0.7 : 0;
        l.rotation.z = ease(l.rotation.z, paw, dt * 14);
      });
    }
    U.wings.forEach(function(w, i){
      var sg = i ? -1 : 1;
      w.rotation.x = sg * (ride ? 0.2 + Math.sin(time * 15) * 0.55 : 0.1 + Math.sin(time * 1.7) * 0.08);
    });

    // head: follows the finger, opens its mouth for food, chews, shakes
    var hp = P.eye();
    var looking = now < act.lookUntil && !ride;
    var pitch = looking ? Math.max(-0.4, Math.min(0.4, (hp[1] - act.py) / 320)) : Math.sin(time * 1.2) * 0.04;
    var yaw = looking ? -Math.max(0.15, Math.min(0.75, 0.3 + (hp[0] - act.px) / 380)) : 0;
    if (act.wants) pitch -= 0.12;
    if (act.munch > 0) {
      act.munch = Math.max(0, act.munch - dt);
      pitch = -0.15 + Math.sin(time * 22) * 0.1;
    }
    var shake = act.idle === "shake" ? Math.sin(act.idleT * 16) * 0.22 : 0;
    U.head.rotation.z = ease(U.head.rotation.z, pitch, dt * 9);
    U.head.rotation.y = ease(U.head.rotation.y, yaw + shake, dt * 9);
    var open = act.munch > 0 ? 0.6 + Math.sin(time * 22) * 0.5 : (act.wants ? 1.25 : 0);
    U.mouth.scale.y = ease(U.mouth.scale.y, 0.085 * (0.45 + open), dt * 16);
    U.mouth.scale.x = ease(U.mouth.scale.x, 0.085 * (0.9 + open * 0.25), dt * 16);

    // eyes: blink, and squint with joy when stroked or all is well
    act.nextBlink -= dt;
    if (act.nextBlink <= 0) { act.blink = 0.14; act.nextBlink = 2.5 + Math.random() * 3; }
    if (act.blink > 0) act.blink -= dt;
    if (act.petting > 0) act.petting -= dt;
    var lid = act.blink > 0 ? 0.08 : (act.petting > 0 ? 0.22 : (happy ? 0.62 : 1));
    U.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, lid, dt * 22); });
    U.ears.forEach(function(e, i){
      var tw = act.idle === "ear" ? Math.sin(act.idleT * 18) * 0.35 : 0;
      e.rotation.z = ease(e.rotation.z, tw, dt * 16);
    });
    if (act.idle) { act.idleT += dt; if (act.idleT > 1.05) act.idle = ""; }

    // foam fades
    for (var i = foam.length - 1; i >= 0; i--) {
      var f = foam[i];
      f.userData.life -= dt;
      var s = f.userData.size * Math.min(1, f.userData.life / 0.8);
      f.scale.setScalar(Math.max(0.001, s));
      if (f.userData.life <= 0) { uni.remove(f); foam.splice(i, 1); }
    }

    // the cat
    var hop = 0;
    if (act.catHop > 0) {
      act.catHop = Math.max(0, act.catHop - dt);
      var cj = 1 - act.catHop / 0.7;
      hop = Math.abs(Math.sin(cj * Math.PI * 2)) * 0.4 * (1 - cj * 0.6);
    }
    var running = (yarn && (yarn.phase === "run" || yarn.phase === "home" || yarn.phase === "drop")) || ride;
    if (ride) {
      cat.position.x = ease(cat.position.x, 2.6, k); cat.position.z = ease(cat.position.z, 1.2, k);
      cat.rotation.y = ease(cat.rotation.y, -0.3, k);
    } else if (!yarn) {
      cat.position.x = ease(cat.position.x, CAT_HOME.x, k); cat.position.z = ease(cat.position.z, CAT_HOME.z, k);
      cat.rotation.y = ease(cat.rotation.y, CAT_ROT, k);
    }
    cat.scale.setScalar(ease(cat.scale.x, ride ? 0.62 : 1.12, k));     // small beside the small riding unicorn
    cat.position.y = hop + (running ? Math.abs(Math.sin(time * 14)) * 0.14 : 0) + (ride ? ride.y * 0.35 : 0);
    C.body.rotation.z = running ? Math.sin(time * 14) * 0.08 : 0;
    C.head.rotation.x = Math.sin(time * 1.7) * 0.07;
    if (act.catPurr > 0) act.catPurr -= dt;
    var clid = act.catPurr > 0 ? 0.2 : (act.blink > 0 ? 0.1 : 1);
    C.eyes.forEach(function(e){ e.scale.y = ease(e.scale.y, clid, dt * 22); });

    renderer.render(scene, camera);
  }

  // little things the unicorn does on its own
  function idle(){
    if (ride || drag || reduced || act.idle) return;
    act.idle = ["ear", "paw", "shake", "ear"][Math.floor(Math.random() * 4)];
    act.idleT = 0;
  }

  function start(hot){
    state = load(hot);
    fit();
    render();
    save();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    window.addEventListener("resize", fit);

    NEEDS.forEach(function(k){
      var btn = $("b-" + k);
      btn.addEventListener("pointerdown", function(e){ dragStart(k, btn, e); });
      btn.addEventListener("pointermove", dragMove);
      btn.addEventListener("pointerup", dragEnd);
      btn.addEventListener("pointercancel", dragEnd);
      btn.addEventListener("click", function(e){
        if (Date.now() - lastDragEnd < 400) return;
        // a tap only shows how: the child has to do it with a finger. (Keyboard still works.)
        if (e.detail === 0) care(k); else showHint(k);
      });
    });

    $("ride").addEventListener("click", function(){ if (ride) stopRide(); else startRide(); });

    // the yarn ball is dragged out of its button and dropped on the grass
    var yb = $("yarn-btn"), yd = null;
    yb.addEventListener("pointerdown", function(e){
      if (ride) return;
      yd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, el: null };
      try { yb.setPointerCapture(e.pointerId); } catch(err){}
    });
    yb.addEventListener("pointermove", function(e){
      if (!yd || e.pointerId !== yd.id) return;
      if (!yd.el) {
        if (Math.hypot(e.clientX - yd.x0, e.clientY - yd.y0) < 10) return;
        yd.el = icon("yarn", 56);
        fx.appendChild(yd.el);
      }
      yd.el.style.transform = tr([e.clientX, e.clientY], 56, 1);
    });
    function yarnDrop(e){
      if (!yd || e.pointerId !== yd.id) return;
      var d = yd; yd = null;
      try { yb.releasePointerCapture(d.id); } catch(err){}
      if (!d.el) return;
      d.el.remove();
      lastDragEnd = Date.now();
      var sr = stage.getBoundingClientRect();
      if (e.type !== "pointercancel" && e.clientX > sr.left && e.clientX < sr.right && e.clientY > sr.top && e.clientY < sr.bottom) {
        throwYarn(e.clientX, e.clientY);
      }
    }
    yb.addEventListener("pointerup", yarnDrop);
    yb.addEventListener("pointercancel", yarnDrop);
    yb.addEventListener("click", function(e){
      if (Date.now() - lastDragEnd < 400) return;
      var sr = stage.getBoundingClientRect();
      var to = [sr.left + sr.width * 0.55, sr.bottom - sr.height * 0.1];
      if (e.detail === 0) throwYarn(to[0], to[1]);
      else showHint("yarn", yb, to);
    });

    // fingers on the 3D picture: stroke the animals, turn the unicorn, throw yarn, steer the ride
    var touch = null;
    canvas.addEventListener("pointerdown", function(e){
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      lookAt(e.clientX, e.clientY);
      if (ride) { touch = { id: e.pointerId, mode: "steer" }; steer(e.clientX, e.clientY); return; }
      var mode = hitUnicorn(e.clientX, e.clientY) ? "uni" : (hitCat(e.clientX, e.clientY) ? "cat" : "bg");
      touch = { id: e.pointerId, mode: mode, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
                dist: 0, n: 0, moved: false, rot0: uni.rotation.y };
    });
    canvas.addEventListener("pointermove", function(e){
      if (ride) {
        if ((touch && touch.id === e.pointerId) || e.pointerType === "mouse") steer(e.clientX, e.clientY);
        return;
      }
      if (!drag) lookAt(e.clientX, e.clientY);
      if (!touch || touch.id !== e.pointerId || touch.mode === "steer") return;
      var step = Math.hypot(e.clientX - touch.x, e.clientY - touch.y);
      touch.x = e.clientX; touch.y = e.clientY;
      if (Math.hypot(touch.x - touch.x0, touch.y - touch.y0) > 10) touch.moved = true;
      if (touch.mode === "bg") {
        // dragging beside the unicorn turns it round
        if (touch.moved) uni.rotation.y = touch.rot0 + (touch.x - touch.x0) * 0.012;
        return;
      }
      touch.dist += step;
      if (touch.dist > 55) {
        touch.dist = 0; touch.n += 1;
        burst("heart", [e.clientX, e.clientY], 1);
        if (touch.mode === "cat") {
          act.catPurr = 0.7;
          if (touch.n % 3 === 1) { tone([196, 220], "sine", .12); catHop(); }   // purr
        } else {
          act.petting = 0.7;
          if (touch.n % 3 === 1) tone([784]);
        }
      }
    });
    function lift(e){
      if (!touch || touch.id !== e.pointerId) return;
      var t = touch; touch = null;
      if (t.mode === "steer") { if (ride) ride.target = 0; return; }
      if (e.type === "pointercancel") return;
      if (t.mode === "uni" && t.n === 0 && !t.moved) pet();
      else if (t.mode === "cat" && t.n === 0 && !t.moved) petCat();
      else if (t.mode === "bg" && !t.moved) throwYarn(e.clientX, e.clientY);   // a tap on the grass throws yarn
    }
    canvas.addEventListener("pointerup", lift);
    canvas.addEventListener("pointercancel", lift);
    canvas.addEventListener("pointerleave", function(e){ if (ride && e.pointerType === "mouse") ride.target = 0; });
    canvas.addEventListener("keydown", function(e){
      if (e.key === "Enter" || (e.key === " " && !ride)) { e.preventDefault(); pet(); }
    });
    document.addEventListener("keydown", function(e){
      if (!ride || e.target.id === "navn") return;
      if (e.key === " " || e.key === "ArrowUp") {
        e.preventDefault();
        ride.target = Math.max(0, rideTop() - UNI_TOP * RIDE_SCALE);
        setTimeout(function(){ if (ride) ride.target = 0; }, 550);
      }
    });
    document.addEventListener("pointermove", function(e){
      if (!drag && !ride && e.target !== canvas) lookAt(e.clientX, e.clientY);
    });

    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ part = t.dataset.part; renderPanel(); });
    });

    $("navn").addEventListener("input", function(){
      cur().name = $("navn").value.slice(0, 12); save();
    });
    $("navn").addEventListener("blur", renderPanel);

    var armed = 0;
    $("slett").addEventListener("click", function(){
      var b = $("slett");
      if (state.list.length < 2) return;
      if (Date.now() - armed < 3000) {
        state.list.splice(state.cur, 1);
        state.cur = 0; armed = 0;
        b.textContent = "Slett";
        save(); render();
      } else {
        armed = Date.now();
        b.textContent = "Sikker?";
        setTimeout(function(){ if (armed && Date.now() - armed >= 3000) { armed = 0; b.textContent = "Slett"; } }, 3100);
      }
    });

    // needs sink slowly while playing; they stop at 10, so nothing is ever lost
    setInterval(function(){
      if (drag) return;
      var u = cur(), changed = false;
      NEEDS.forEach(function(k){
        if (u[k] > 10) { u[k] = Math.max(10, u[k] - 0.6); changed = true; }
      });
      if (changed) { u.t = Date.now(); save(); renderLook(); renderMood(); }
    }, 3000);
    setInterval(idle, 5200);

    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        window.claude.hot.snapshot(function(){ return state; });
      }
    } catch(e){}

    frame();
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
